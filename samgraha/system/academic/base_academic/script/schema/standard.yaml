  # --- Proposal gate usecases (docs/proposal/base_academic-proposal-gate-
  #     workflow-proposal.md). Fixed-shape, whole-run — literal steps:,
  #     same pattern as schema-init/classify-repo, not expand_triads(). ---
  - name: propose-generation
    description: "draft a whole-run proposal of what generation is about to write"
    steps:
      - order: 1
        kind: deterministic
        description: "Gather upstream analysis + domain list"
        script: gather-proposal-context
      - order: 2
        kind: semantic
        description: "Draft the generation proposal"
        prompt: generation-proposal
      - order: 3
        kind: deterministic
        description: "Persist proposal (status=pending)"
        script: persist-proposal
      - order: 4
        kind: deterministic
        description: "Render proposal to markdown+html"
        script: render-proposal

  - name: propose-audit
    description: "draft a whole-run proposal of what audit is about to check"
    steps:
      - order: 1
        kind: deterministic
        description: "Gather generation-complete domains + rubrics + models"
        script: gather-proposal-context
      - order: 2
        kind: semantic
        description: "Draft the audit proposal"
        prompt: audit-proposal
      - order: 3
        kind: deterministic
        description: "Persist proposal (status=pending)"
        script: persist-proposal
      - order: 4
        kind: deterministic
        description: "Render proposal to markdown+html"
        script: render-proposal

  - name: propose-report
    description: "draft a whole-run proposal of what report artifacts this run will produce"
    # Deterministic-only — 3 steps, no prompt/semantic step. render-charts/
    # render-audit-report/render-paper are 100% script+template+DB (no LLM
    # step anywhere in that chain, confirmed against this file — render-paper
    # has no script registered yet, "planned, not yet built" per plan/usecase/
    # 6c-render-paper.md), and every fact in a report proposal is already
    # computed by gather-proposal-context — nothing for a model to judge, so
    # nothing to stage a prepare_semantic_step/complete_semantic_step for.
    steps:
      - order: 1
        kind: deterministic
        description: "Gather latest score + report-kind list, auto-build proposal summary"
        script: gather-proposal-context
      - order: 2
        kind: deterministic
        description: "Persist proposal (status=pending)"
        script: persist-proposal
      - order: 3
        kind: deterministic
        description: "Render proposal to markdown+html"
        script: render-proposal

  - name: propose-fix
    description: "draft what a fix will change and why, before regenerating a domain"
    steps:
      - order: 1
        kind: deterministic
        description: "Gather failing findings or user comment + resolved domain"
        script: gather-proposal-context
      - order: 2
        kind: semantic
        description: "Draft the fix proposal"
        prompt: fix-proposal
      - order: 3
        kind: deterministic
        description: "Persist proposal (status=pending)"
        script: persist-proposal
      - order: 4
        kind: deterministic
        description: "Render proposal to markdown+html"
        script: render-proposal

  - name: approve-proposal
    description: "human decision step — flips a pending proposal to approved/rejected"
    steps:
      - order: 1
        kind: deterministic
        description: "Flip latest pending proposal to approved or rejected"
        script: approve-proposal
