<section class="domain domain-problem-definition">
  <h2>Problem Statement</h2>

  <h2>Scope</h2>
  {{{ scope }}}

  <h2>Assumptions</h2>

  <ol class="citations">
    {{#citations}}

  </ol>
</section>
