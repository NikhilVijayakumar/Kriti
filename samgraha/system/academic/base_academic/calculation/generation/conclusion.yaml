id: conclusion
domain: conclusion
checks:
  - id: co-001
    name: word_count_in_range
    rule: word_count_in_range
    severity: critical
    config: { min: 200, max: 600 }
    description: "Conclusion word count within configured range"
  - id: co-002
    name: no_citations
    rule: no_citations
    severity: warning
    description: "No citation markers in conclusion"
  - id: co-003
    name: no_new_results
    rule: no_new_results
    severity: critical
    description: "No numeric results not already in results"
  - id: co-004
    name: length_proportion
    rule: length_proportion
    severity: warning
    config: { compare_to: introduction, max_ratio: 1.5 }
    description: "Conclusion length proportionate to introduction"
  - id: co-005
    name: no_placeholders
    rule: no_placeholders
    severity: critical
    description: "No unfilled template markers"
  - id: conc-cit
    name: citation_marker_present
    rule: min_citation_count
    severity: critical
    config: { min: 1 }
    description: "Domain contains at least one citation marker"
  - id: conc-bfit
    name: budget_fit_applied
    rule: budget_fit_applied
    severity: critical
    description: "stage='budget-fit' narrative row exists for this domain"
