id: related-work
domain: related-work
checks:
  - id: rw-001
    name: word_count_in_range
    rule: word_count_in_range
    severity: critical
    config: { min: 400, max: 800 }
    description: "Related work word count within configured range"
  - id: rw-002
    name: min_citation_count
    rule: min_citation_count
    severity: warning
    config: { min: 5 }
    description: "Minimum citation count met"
  - id: rw-003
    name: has_subsections
    rule: regex_match
    severity: warning
    config: { pattern: "^##\\s" }
    description: "Taxonomy structure (subsections) present"
  - id: rw-004
    name: no_placeholders
    rule: no_placeholders
    severity: critical
    description: "No unfilled template markers"
  - id: relw-cit
    name: citation_marker_present
    rule: min_citation_count
    severity: critical
    config: { min: 1 }
    description: "Domain contains at least one citation marker"
  - id: relw-bfit
    name: budget_fit_applied
    rule: budget_fit_applied
    severity: critical
    description: "stage='budget-fit' narrative row exists for this domain"
