id: limitations
domain: limitations
checks:
  - id: li-001
    name: word_count_in_range
    rule: word_count_in_range
    severity: critical
    config: { min: 200, max: 500 }
    description: "Limitations word count within configured range"
  - id: li-002
    name: limitations_present
    rule: min_list_items
    severity: warning
    config: { min: 1 }
    description: "At least one limitation listed"
  - id: li-003
    name: no_new_results
    rule: no_new_results
    severity: critical
    description: "No new results or claims introduced (cross-ref with results)"
  - id: li-004
    name: no_placeholders
    rule: no_placeholders
    severity: critical
    description: "No unfilled template markers"
  - id: limi-cit
    name: citation_marker_present
    rule: min_citation_count
    severity: critical
    config: { min: 1 }
    description: "Domain contains at least one citation marker"
  - id: limi-bfit
    name: budget_fit_applied
    rule: budget_fit_applied
    severity: critical
    description: "stage='budget-fit' narrative row exists for this domain"
