id: results
domain: results
checks:
  - id: re-001
    name: word_count_in_range
    rule: word_count_in_range
    severity: critical
    config: { min: 500, max: 1200 }
    description: "Results word count within configured range"
  - id: re-002
    name: metrics_reported
    rule: regex_match
    severity: critical
    config: { pattern: "(?i)(?:accuracy|precision|recall|F1|RMSE|MAE|AUC|latency|throughput)" }
    description: "Standard metrics reported"
  - id: re-003
    name: significance_test
    rule: regex_match
    severity: warning
    config: { pattern: "(?i)(?:p-value|confidence interval|t-test|wilcoxon|mcnemar|significance)" }
    description: "Statistical significance test named"
  - id: re-004
    name: numbers_match_abstract
    rule: cross_reference_numbers
    severity: critical
    config: { other_domain: abstract }
    description: "Numbers in results match abstract"
  - id: re-005
    name: tables_figures_captioned
    rule: regex_match
    severity: warning
    config: { pattern: "(?i)(?:Table \\d|Figure \\d|Fig\\. \\d)" }
    description: "Tables/figures referenced from prose"
  - id: re-006
    name: min_table_count
    rule: min_table_count
    severity: critical
    config: { min: 1 }
    description: "At least one table present"
  - id: re-007
    name: no_placeholders
    rule: no_placeholders
    severity: critical
    description: "No unfilled template markers"
  - id: resu-cit
    name: citation_marker_present
    rule: min_citation_count
    severity: critical
    config: { min: 1 }
    description: "Domain contains at least one citation marker"
  - id: resu-bfit
    name: budget_fit_applied
    rule: budget_fit_applied
    severity: critical
    description: "stage='budget-fit' narrative row exists for this domain"
