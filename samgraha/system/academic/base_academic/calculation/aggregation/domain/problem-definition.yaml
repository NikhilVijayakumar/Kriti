id: aggregation_problem_definition
calculation: weighted_merge
scope: domain
inputs:
  deterministic: calculation/deterministic/problem-definition.yaml
  semantic: calculation/semantic/full-part-blend.yaml
weights:
  deterministic: 0.50
  semantic: 0.50
formula: |
  final_score = (deterministic.score * weights.deterministic) + (semantic.score * weights.semantic)
note: >
  Per-domain 50/50 deterministic/semantic blend, matching
  calculation/summary/final_score.yaml's per-domain half.
