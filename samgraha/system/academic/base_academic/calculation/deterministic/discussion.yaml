id: discussion
domain: discussion
checks:
  - id: di-001
    name: threats_to_validity
    rule: regex_match
    severity: warning
    config: { pattern: "(?i)(?:threats?.to.validity|validity|internal.validity|external.validity)" }
    description: "Threats-to-validity subsection present"
  - id: di-002
    name: no_placeholders
    rule: no_placeholders
    severity: critical
    description: "No unfilled template markers"
  - id: disc-cit
    name: citation_marker_present
    rule: min_citation_count
    severity: critical
    config: { min: 1 }
    description: "Domain contains at least one citation marker"
  - id: disc-bfit
    name: budget_fit_applied
    rule: budget_fit_applied
    severity: critical
    description: "stage='budget-fit' narrative row exists for this domain"
