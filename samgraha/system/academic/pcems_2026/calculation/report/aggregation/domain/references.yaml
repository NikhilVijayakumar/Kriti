id: aggregation_references
calculation: weighted_merge
scope: domain
inputs:
  deterministic: calculation/generation/references.yaml
  semantic: calculation/report/semantic/full-part-blend.yaml
weights:
  deterministic: 0.50
  semantic: 0.50
formula: |
  final_score = (deterministic.score * weights.deterministic) + (semantic.score * weights.semantic)
