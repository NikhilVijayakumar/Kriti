id: findings
domain: findings
checks:
  - id: fi-001
    name: word_count_in_range
    rule: word_count_in_range
    severity: critical
    config: { min: 600, max: 1200 }
    description: "Findings word count within configured range"
  - id: fi-002
    name: tables_present
    rule: contains_table
    severity: warning
    description: "At least 1 table present (sample avg: 2.5)"
  - id: fi-003
    name: figures_present
    rule: contains_figure
    severity: warning
    description: "At least 1 figure present (sample avg: 2.8)"
  - id: fi-004
    name: baseline_comparison
    rule: regex_match
    severity: warning
    config: { pattern: "(?i)(?:comparison|baseline|existing\\s+method|state.of.the.art)" }
    description: "Comparison with baseline methods present"
  - id: fi-005
    name: quantitative_results
    rule: contains_number
    severity: warning
    description: "Quantitative results (accuracy, precision, etc.) present"
  - id: fi-006
    name: no_placeholders
    rule: no_placeholders
    severity: critical
    description: "No unfilled template markers"
  - id: find-cit
    name: citation_marker_present
    rule: min_citation_count
    severity: critical
    config: { min: 1 }
    description: "Domain contains at least one citation marker"
  - id: find-bfit
    name: budget_fit_applied
    rule: budget_fit_applied
    severity: info
    description: "stage='budget-fit' narrative row exists for this domain"
  - id: fi-ailang
    name: ai_language_flags
    rule: ai_language_flags
    severity: warning
    description: "No AI-generated language flags (Writing Guide/01)"
  - id: fi-cftcol
    name: citation_figure_table_collision
    rule: citation_figure_table_collision
    severity: warning
    description: "Citation numbers [N] don't collide with Fig. N or Table N"
