id: introduction
domain: introduction
checks:
  - id: in-001
    name: word_count_in_range
    rule: word_count_in_range
    severity: critical
    config: { min: 400, max: 800 }
    description: "Introduction word count within configured range"
  - id: in-002
    name: contributions_list
    rule: regex_match
    severity: warning
    config: { pattern: "(?i)(?:contributions|we\\s+make|our\\s+contributions|this\\s+paper\\s+proposes)" }
    description: "Contributions section present"
  - id: in-003
    name: has_list_items
    rule: min_list_items
    severity: warning
    config: { min: 2 }
    description: "Contributions are listed (bulleted/numbered)"
  - id: in-004
    name: citation_marker_present
    rule: min_citation_count
    severity: critical
    config: { min: 5 }
    description: "At least 5 citation markers (PCEMS sample avg: 10)"
  - id: in-005
    name: no_placeholders
    rule: no_placeholders
    severity: critical
    description: "No unfilled template markers"
  - id: in-006
    name: no_methodology_content
    rule: regex_absent
    severity: warning
    config: { pattern: "(?i)(?:algorithm|pseudocode|equation\\s+\\(\\d\\))" }
    description: "No methodology details in Introduction"
  - id: intro-bfit
    name: budget_fit_applied
    rule: budget_fit_applied
    severity: critical
    description: "stage='budget-fit' narrative row exists for this domain"
