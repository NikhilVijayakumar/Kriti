id: mathematics
domain: mathematics
checks:
  - id: ma-001
    name: word_count_in_range
    rule: word_count_in_range
    severity: critical
    config: { min: 300, max: 800 }
    description: "Mathematics word count within configured range"
  - id: ma-002
    name: equations_present
    rule: contains_equation
    severity: warning
    description: "Equations/formulas present"
  - id: ma-003
    name: min_formula_count
    rule: min_formula_count
    severity: warning
    config: { min: 1 }
    description: "At least one formula present"
  - id: ma-004
    name: complexity_notation
    rule: regex_match
    severity: warning
    config: { pattern: "(?i)(?:O\\(|complexity|time complexity|space complexity)" }
    description: "Complexity notation present for algorithmic procedures"
  - id: ma-005
    name: variables_defined
    rule: regex_match
    severity: warning
    config: { pattern: "(?i)(?:where|denotes|represents|defined as)" }
    description: "Variables defined at first use"
  - id: ma-006
    name: no_placeholders
    rule: no_placeholders
    severity: critical
    description: "No unfilled template markers"
  - id: math-cit
    name: citation_marker_present
    rule: min_citation_count
    severity: critical
    config: { min: 1 }
    description: "Domain contains at least one citation marker"
  - id: math-bfit
    name: budget_fit_applied
    rule: budget_fit_applied
    severity: info
    description: "stage='budget-fit' narrative row exists for this domain"
  - id: ma-ailang
    name: ai_language_flags
    rule: ai_language_flags
    severity: warning
    description: "No AI-generated language flags (Writing Guide/01)"
  - id: ma-cftcol
    name: citation_figure_table_collision
    rule: citation_figure_table_collision
    severity: warning
    description: "Citation numbers [N] don't collide with Fig. N or Table N"
  - id: ma-acrdef
    name: acronym_defined_at_first_use
    rule: acronym_defined_at_first_use
    severity: warning
    description: "Acronyms (2+ uppercase letters) defined before first use"
  - id: ma-termcon
    name: terminology_consistency
    rule: terminology_consistency
    severity: warning
    description: "No casing/hyphenation variants of same term"
  - id: ma-sentlen
    name: sentence_length_distribution
    rule: sentence_length_distribution
    severity: warning
    config: { min: 15, max: 25 }
    description: "80% of sentences within 15-25 words (Writing Guide/01)"
  - id: ma-readability
    name: readability_score_in_range
    rule: readability_score_in_range
    severity: info
    config: { min: 30, max: 60, metric: flesch_reading_ease }
    description: "Flesch reading ease 30-60 (academic prose target)"
