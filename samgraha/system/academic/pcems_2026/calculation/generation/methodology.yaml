id: methodology
domain: methodology
checks:
  - id: me-001
    name: word_count_in_range
    rule: word_count_in_range
    severity: critical
    config: { min: 600, max: 1200 }
    description: "Methodology word count within configured range"
  - id: me-002
    name: diagram_present
    rule: contains_mermaid_diagram
    severity: warning
    description: "Architecture/flowchart diagram present (9/11 sample papers include one)"
  - id: me-003
    name: equations_present
    rule: contains_equation
    severity: warning
    description: "Equations/formulas present (7/11 sample papers include at least one)"
  - id: me-004
    name: min_formula_count
    rule: min_formula_count
    severity: warning
    config: { min: 1 }
    description: "At least one formula present"
  - id: me-005
    name: implementation_details
    rule: regex_match
    severity: warning
    config: { pattern: "(?i)(?:library|framework|tool|version|python|tensorflow|keras|scikit)" }
    description: "Implementation details (tools/libraries) specified"
  - id: me-006
    name: no_placeholders
    rule: no_placeholders
    severity: critical
    description: "No unfilled template markers"
  - id: meth-cit
    name: citation_marker_present
    rule: min_citation_count
    severity: critical
    config: { min: 1 }
    description: "Domain contains at least one citation marker"
  - id: meth-bfit
    name: budget_fit_applied
    rule: budget_fit_applied
    severity: info
    description: "stage='budget-fit' narrative row exists for this domain"
  - id: me-ailang
    name: ai_language_flags
    rule: ai_language_flags
    severity: warning
    description: "No AI-generated language flags (Writing Guide/01)"
