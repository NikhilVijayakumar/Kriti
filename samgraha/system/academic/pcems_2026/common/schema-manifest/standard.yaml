custom_tables:
  - table_name: academic_papers
    purpose: "one row per registered paper (repo + system)"
    owner_script: init-schema
  - table_name: academic_repos
    purpose: "one row per (repo_root, system) classification result (2-state)"
    owner_script: classify-repo
  - table_name: academic_domains
    purpose: "lookup: scoring domains for PCEMS 2026"
    owner_script: init-schema
  - table_name: academic_modules
    purpose: "one row per detected module in a repo"
    owner_script: discover-modules
  - table_name: academic_module_analysis
    purpose: "per (module, analysis_kind) section content"
    owner_script: persist-module-analysis
  - table_name: academic_cross_module_analysis
    purpose: "per (repo, analysis_kind) section content"
    owner_script: persist-cross-module-analysis
  - table_name: academic_narratives
    purpose: "one row per (paper, domain, stage) — stores section drafts with stage tracking"
    owner_script: persist-section-draft
  - table_name: academic_narrative_sections
    purpose: "per-narrative heading+text sections"
    owner_script: persist-section-draft
  - table_name: academic_section_citations
    purpose: "per (paper, domain): citations attached to a structural domain's draft"
    owner_script: persist-section-citations
  - table_name: academic_literature_citation
    purpose: "master registry of literature citations for a paper — curated, not LLM-generated"
    owner_script: import-literature
  - table_name: academic_table_map
    purpose: "per-item registry of extracted tables from evaluation markdown"
    owner_script: persist-map-entries
  - table_name: academic_figure_map
    purpose: "per-item registry of extracted figures from visualization assets"
    owner_script: persist-map-entries
  - table_name: academic_equation_map
    purpose: "per-item registry of extracted equations from mathematics docs"
    owner_script: persist-map-entries
  - table_name: academic_algorithm_map
    purpose: "per-item registry of extracted algorithms from mathematics docs"
    owner_script: persist-map-entries
  - table_name: academic_semantic_runs
    purpose: "one row per (paper, domain, scope, model) semantic evaluation"
    owner_script: persist-domain-semantic-score
  - table_name: academic_semantic_dimension_scores
    purpose: "per-dimension score+evidence for a semantic run"
    owner_script: persist-domain-semantic-score
  - table_name: academic_semantic_findings
    purpose: "per-run strengths/weaknesses/recommendations"
    owner_script: persist-domain-semantic-score
  - table_name: academic_plagiarism_findings
    purpose: "per (paper, domain, run, pass_type, check_kind): PASS/FAIL + flagged spans"
    owner_script: persist-plagiarism-findings
  - table_name: academic_humanize_passes
    purpose: "per (paper, domain, iteration, pass_kind): change summary + risk flags"
    owner_script: persist-humanize-pass
  - table_name: academic_templates
    purpose: "catalog of report/generation templates on disk"
    owner_script: init-schema
  - table_name: academic_score_history
    purpose: "one row per calculate.py run (trend tracking)"
    owner_script: calculate
  - table_name: academic_deterministic_findings
    purpose: "per (paper, domain, scope, run): deterministic audit verdict + findings"
    owner_script: deterministic-audit
  - table_name: academic_visualization_types
    purpose: "chart type catalog"
    owner_script: init-schema
  - table_name: academic_visualizations
    purpose: "one row per rendered chart image"
    owner_script: render-charts
  - table_name: academic_report_history
    purpose: "one row per render run (paper or audit track)"
    owner_script: render-paper
  - table_name: academic_proposal_review
    purpose: "one row per proposal review decision — gate for downstream pipeline stages"
    owner_script: approve-proposal
  - table_name: academic_proposal_scope
    purpose: "domain scope rows per proposal — what domains/usecases/steps a proposal covers"
    owner_script: link-proposal-scope
  - table_name: academic_calculation_dependencies
    purpose: "per calc file: declared dependency edges and whether each file is consumed at runtime"
    owner_script: schema-init
  - table_name: academic_step0_claim_findings
    purpose: "per-claim verification findings for Step 0 extracted items — append-only, one row per (claim, check_kind)"
    owner_script: verify-step0-claims

usecases:
  - name: schema-init
    description: "create academic_* tables before anything else writes to them"
    steps:
      - order: 1
        kind: deterministic
        description: "Create academic_* tables, seed PCEMS 2026 domains and templates"
        script: init-schema

  - name: classify-repo
    description: "entry router — scan repo for documentation, classify into NO_DOCS / HAS_DOCS"
    steps:
      - order: 1
        kind: deterministic
        description: "Scan repo for author-supplied documentation; persist classification"
        script: classify-repo

  - name: docs-first-ingestion
    description: "discover module structure from docs/paper/{system}/modules/ and load pre-existing analysis into DB"
    steps:
      - order: 1
        kind: deterministic
        description: "Discover module boundaries from docs/paper/{system}/modules/ directory structure"
        script: discover-docs-modules
      - order: 2
        kind: deterministic
        description: "Load per-module analysis .md files from discovered modules into academic_module_analysis"
        script: load-docs-module-analysis
      - order: 3
        kind: deterministic
        description: "Load cross_module/*.md files from cross-module pseudo-modules into academic_cross_module_analysis"
        script: load-docs-cross-module-analysis

  - name: novelty-analysis
    description: "identify what's novel, sourced from the repo's actual documentation"
    steps:
      - order: 1
        kind: semantic
        description: "Analyze per-module novelty from source evidence; output markdown with evidence links"
        prompt: module-analysis-novelty
      - order: 2
        kind: deterministic
        description: "Persist per-module novelty analysis (analysis_kind=novelty) to academic_module_analysis"
        script: persist-module-analysis
      - order: 3
        kind: semantic
        description: "Synthesize cross-module novelty — system-level novelty claims and differentiation"
        prompt: cross-module-analysis-novelty
      - order: 4
        kind: deterministic
        description: "Persist cross-module novelty analysis (analysis_kind=novelty) to academic_cross_module_analysis"
        script: persist-cross-module-analysis

  - name: gap-analysis
    description: "identify gaps, sourced from the repo's actual documentation"
    steps:
      - order: 1
        kind: semantic
        description: "Analyze per-module gaps — missing features, code quality, test/docs coverage"
        prompt: module-analysis-gaps
      - order: 2
        kind: deterministic
        description: "Persist per-module gap analysis (analysis_kind=gaps) to academic_module_analysis"
        script: persist-module-analysis
      - order: 3
        kind: semantic
        description: "Synthesize cross-module gaps — integration gaps, cross-cutting concerns"
        prompt: cross-module-analysis-gaps
      - order: 4
        kind: deterministic
        description: "Persist cross-module gap analysis (analysis_kind=gaps) to academic_cross_module_analysis"
        script: persist-cross-module-analysis

  - name: mathematics-analysis
    description: "derive mathematical formalization from documentation"
    steps:
      - order: 1
        kind: semantic
        description: "Analyze per-module mathematics — algorithm identification, complexity, LaTeX formulas"
        prompt: module-analysis-mathematics
      - order: 2
        kind: deterministic
        description: "Persist per-module mathematics analysis (analysis_kind=mathematics) to academic_module_analysis"
        script: persist-module-analysis
      - order: 3
        kind: semantic
        description: "Synthesize cross-module mathematics — shared foundations, system-level complexity profile"
        prompt: cross-module-analysis-mathematics
      - order: 4
        kind: deterministic
        description: "Persist cross-module mathematics analysis (analysis_kind=mathematics) to academic_cross_module_analysis"
        script: persist-cross-module-analysis

  - name: diagram-architecture-analysis
    description: "produce cross-module architecture, dependency, and interaction diagrams"
    steps:
      - order: 1
        kind: semantic
        description: "Analyze per-module architecture — design patterns, component structure, data flow, mermaid classDiagram"
        prompt: module-analysis-architecture
      - order: 2
        kind: deterministic
        description: "Persist per-module architecture analysis (analysis_kind=architecture) to academic_module_analysis"
        script: persist-module-analysis
      - order: 3
        kind: semantic
        description: "Synthesize cross-module architecture — layer analysis, integration points, mermaid flowchart"
        prompt: cross-module-analysis-architecture
      - order: 4
        kind: deterministic
        description: "Persist cross-module architecture analysis (analysis_kind=architecture) to academic_cross_module_analysis"
        script: persist-cross-module-analysis
      - order: 5
        kind: semantic
        description: "Map dependency graph — coupling, circular deps, stability analysis, mermaid flowchart"
        prompt: cross-module-analysis-dependencies
      - order: 6
        kind: deterministic
        description: "Persist cross-module dependency analysis (analysis_kind=dependencies) to academic_cross_module_analysis"
        script: persist-cross-module-analysis
      - order: 7
        kind: semantic
        description: "Analyze runtime interactions — data flow, control flow, event patterns, mermaid flowchart"
        prompt: cross-module-analysis-interactions
      - order: 8
        kind: deterministic
        description: "Persist cross-module interaction analysis (analysis_kind=interactions) to academic_cross_module_analysis"
        script: persist-cross-module-analysis

  - name: figures-analysis
    description: "identify candidate figure locations from source code evidence"
    steps:
      - order: 1
        kind: semantic
        description: "Analyze per-module figure candidates — architecture diagrams, data charts, with evidence links"
        prompt: module-analysis-figures
      - order: 2
