# pcems_2026 — samgraha standard manifest.
#
# PCEMS 2026 conference-paper system: 6 section domains
# (title-and-metadata, introduction, methodology, findings, conclusion,
# references) + 5 cross-cutting domains (novelty, gaps, mathematics,
# tables, figures).
#
# 2-state classification gate: NO_DOCS (refuse) / HAS_DOCS (Proceeds).
# Deterministic + semantic audit layer, 50/50 weight split.
# Two-bucket scoring model: semantic_document + deterministic_document.
#
# Fully self-contained — every scripts:/prompts: location: points inside
# pcems_2026's own tree (script/, prompt/, schema/). Originally shared
# base_academic's infrastructure by cross-directory reference; forked into
# local copies so no standard reaches into another's files. Paths are
# relative to this file's location (script/schema/).

name: pcems_2026
version: "1.0.0"
description: "PCEMS 2026 conference-paper evaluation system — 6 structural domains, 5 cross-cutting domains, deterministic + semantic audit, 50/50 weight split"
seeder_script: ../script/seeder.py
smoke_test: ../smoke_test.py

classify_repo:
  min_doc_words: 200

scripts:
  # --- schema-init usecase ---
  - name: init-schema
    location: ../../common/script/init_schema.py
    purpose: "create academic_* tables if missing, seed PCEMS 2026 domains and templates"
  # --- classify-repo usecase ---
  - name: classify-repo
    location: ../../common/script/classify_repo.py
    purpose: "entry router — scan repo for documentation, classify into NO_DOCS / HAS_DOCS"
  # --- shared: novelty-analysis + gap-analysis + mathematics-analysis ---
  - name: discover-modules
    location: ../../step0-extract/analysis/script/discover_modules.py
    purpose: "discover module boundaries in the target repo; persist to academic_modules"
  - name: gather-module-evidence
    location: ../../step0-extract/analysis/script/gather_module_evidence.py
    purpose: "gather one module's source files, imports, docstrings, signatures"
  - name: gather-cross-module-evidence
    location: ../../step0-extract/analysis/script/gather_cross_module_evidence.py
    purpose: "aggregate every module's evidence + repo-wide import graph"
  - name: gather-cross-cutting-evidence
    location: ../../step0-extract/analysis/script/gather_cross_cutting_evidence.py
    purpose: "read academic_cross_module_analysis for a given analysis_kind"
  - name: gather-tables-figures-evidence
    location: ../../step1-draft-for-completeness/section/script/gather_tables_figures_evidence.py
    purpose: "read the findings domain's current draft as evidence for a tables/figures audit (no upstream module analysis exists for these two domains)"
  - name: persist-module-analysis
    location: ../../step0-extract/analysis/script/persist_module_analysis.py
    purpose: "persist one module's analysis section + write to docs/paper/{system}/modules/"
  - name: persist-cross-module-analysis
    location: ../../step0-extract/analysis/script/persist_cross_module_analysis.py
    purpose: "persist cross-module analysis + write to docs/paper/{system}/cross_module/"
  # --- shared: docs-first ingestion ---
  - name: discover-docs-modules
    location: ../../step0-extract/analysis/script/discover_docs_modules.py
    purpose: "discover module boundaries from docs/paper/{system}/modules/ structure"
  - name: load-docs-module-analysis
    location: ../../step0-extract/analysis/script/load_docs_module_analysis.py
    purpose: "load pre-existing per-module analysis .md files into academic_module_analysis"
  - name: load-docs-cross-module-analysis
    location: ../../step0-extract/analysis/script/load_docs_cross_module_analysis.py
    purpose: "load pre-existing cross_module/*.md files into academic_cross_module_analysis"
  # --- verify-step0-claims usecase ---
  - name: gather-claim-evidence
    location: ../../step0-extract/verify/script/gather_claim_evidence.py
    purpose: "gather all map/analysis rows for a module/paper with their source_evidence + relevance_note"
  - name: check-evidence-resolves
    location: ../../step0-extract/verify/script/check_evidence_resolves.py
    purpose: "deterministic — does source_evidence point at an existing file?"
  - name: check-evidence-contains-claim
    location: ../../step0-extract/verify/script/check_evidence_contains_claim.py
    purpose: "deterministic — does evidence file content contain key claim terms?"
  - name: persist-claim-findings
    location: ../../step0-extract/verify/script/persist_claim_findings.py
    purpose: "persist verification findings to academic_step0_claim_findings"
  # --- shared: assemble-paper-structure + semantic-audit ---
  - name: gather-domain-evidence
    location: ../../step1-draft-for-completeness/section/script/gather_domain_evidence.py
    purpose: "gather evidence for a domain — pulls docs, analysis, or draft text depending on context"
  # --- section draft / citation / signal usecases ---
  - name: persist-section-draft
    location: ../../step1-draft-for-completeness/section/script/persist_section_draft.py
    purpose: "persist generated/humanized section draft"
  - name: persist-section-citations
    location: ../../step1-draft-for-completeness/section/script/persist_section_citations.py
    purpose: "persist citations to academic_section_citations"
  - name: collate-references
    location: ../../step0-extract/map/script/citation/collate_references.py
    purpose: "collate all literature citations into the references domain draft"
  - name: render-section-draft
    location: ../../step1-draft-for-completeness/section/script/render_section_draft.py
    purpose: "render each domain's section draft as a separate numbered markdown file"
  - name: gather-unassigned-assets
    location: ../../step1-draft-for-completeness/section/script/gather_unassigned_assets.py
    purpose: "gather Step-0-extracted assets (map entries + citations) with no target_section/domain_id assigned yet"
  - name: persist-target-section-assignments
    location: ../../step1-draft-for-completeness/section/script/persist_target_section_assignments.py
    purpose: "write LLM-decided target_section (or domain_id, for citations) back into the map tables"
  - name: import-literature
    location: ../../step0-extract/map/script/citation/import_literature.py
    purpose: "seed academic_literature_citation from a curated bibliography file"
  - name: classify-citations
    location: ../../step0-extract/map/script/citation/classify_citations.py
    purpose: "classify extracted citation markers as literature or in-repo"
  - name: commit-input
    location: ../../step0-extract/input/script/commit_input.py
    purpose: "persist confirmed input metadata (title, authors, venue) to academic_papers.metadata after proposal approval"
  - name: commit-modules
    location: ../../step0-extract/input/script/commit_modules.py
    purpose: "read metadata.yaml modules block, upsert one row per declared module into academic_modules with role/path/weight/reason"
  - name: commit-map
    location: ../../step0-extract/map/script/commit_map.py
    purpose: "persist approved map entries to the corresponding academic_{x}_map table"
  # --- extraction-map scripts ---
  - name: gather-map-evidence
    location: ../../step0-extract/map/script/gather_map_evidence.py
    purpose: "gather source evidence files for a map extraction domain (tables, figures, equations, algorithms)"
  - name: persist-map-entries
    location: ../../step0-extract/map/script/persist_map_entries.py
    purpose: "persist structured map entries into academic_{table,figure,equation,algorithm}_map"
  # --- figure-asset-generation scripts (proposal 04) ---
  - name: generate-mermaid-figure
    location: ../../step0-extract/map/script/figure/generate_mermaid_figure.py
    purpose: "validate mermaid_source via render_mmdc and persist to academic_figure_map"
  - name: generate-data-chart
    location: ../../step0-extract/map/script/figure/generate_data_chart.py
    purpose: "render data-driven charts from academic_table_map rows, persist asset_path"
  # --- keyword-map usecase (build-keyword-map) ---
  - name: gather-keyword-evidence
    location: ../../common/script/keyword/gather_keyword_evidence.py
    purpose: "gather per-module approved analysis content + classification.keywords for keyword-map building"
  - name: persist-keyword-map
    location: ../../common/script/keyword/persist_keyword_map.py
    purpose: "persist semantic keyword-map output rows to academic_keyword_map"
  - name: verify-keyword-coverage
    location: ../../common/script/keyword/verify_keyword_coverage.py
    purpose: "compare academic_keyword_map against declared keywords, flag gaps + candidates"
  # --- word-budget check ---
  - name: check-word-budget
    location: ../../step1-draft-for-completeness/section/script/check_word_budget.py
    purpose: "deterministic word-count check against per-domain and whole-paper budgets"
  # --- deterministic-audit usecase ---
  - name: deterministic-audit
    location: ../../step1-draft-for-completeness/audit/script/deterministic_audit.py
    purpose: "run deterministic checks against calculation/deterministic/{domain}.yaml rules"
  # --- semantic-audit usecase ---
  - name: persist-domain-semantic-score
    location: ../../step1-draft-for-completeness/audit/script/persist_domain_semantic_score.py
    purpose: "persist agent's per-domain semantic score"
  # --- plagiarism-forensic-audit usecase ---
  - name: gather-plagiarism-context
    location: ../../step3-plagiarism-humanize/plagiarism/script/gather_plagiarism_context.py
    purpose: "gather current draft text for plagiarism/fingerprint check"
  - name: deterministic-fingerprint-check
    location: ../../step3-plagiarism-humanize/plagiarism/script/deterministic_fingerprint_check.py
    purpose: "mechanical plagiarism pre-screen: burstiness, n-gram repetition, banned phrases"
  - name: persist-plagiarism-findings
    location: ../../step3-plagiarism-humanize/plagiarism/script/persist_plagiarism_findings.py
    purpose: "persist plagiarism/fingerprint PASS/FAIL + flagged spans"
  # --- humanize usecase ---
  - name: gather-humanize-context
    location: ../../step3-plagiarism-humanize/humanize/script/gather_humanize_context.py
    purpose: "gather draft + flagged spans for humanize rewrite"
  - name: persist-humanize-pass
    location: ../../step3-plagiarism-humanize/humanize/script/persist_humanize_pass.py
    purpose: "persist humanize rewrite result + change summary + risk flags"
  - name: nlp-fingerprint-fix
    location: ../../step3-plagiarism-humanize/humanize/script/nlp_fingerprint_fix.py
    purpose: "deterministic Layer 1 humanize: sentence-length variance, parallel-structure breaking"
  # --- cross-section-semantic-audit usecase ---
  - name: gather-cross-section-evidence
    location: ../../step4 - final paper/script/gather_cross_section_evidence.py
    purpose: "concatenate all domain section texts for cross-section consistency review"
  # --- document-semantic-audit usecase ---
  - name: gather-document-evidence
    location: ../../step4 - final paper/script/gather_document_evidence.py
    purpose: "concatenate all domain section texts for whole-document holistic review"
  # --- reviewer-simulation usecase ---
  - name: persist-reviewer-simulation
    location: ../../step4 - final paper/script/persist_reviewer_simulation.py
    purpose: "reshape 3-persona reviewer result into generic semantic-run shape, persist to reviewer-simulation domain"
  # --- calculate usecase ---
  - name: calculate
    location: ../../step4 - final paper/script/calculate.py
    purpose: "compute final_score from semantic + deterministic buckets (50/50), track trend"
  # --- render-paper usecase ---
  - name: extract-tables-figures
    location: ../../step4 - final paper/script/render/extract-tables-figures.py
    purpose: "extract findings' embedded tables/figures into standalone files under draft/paper-{id}/{tables,visualization}/, before markdown/html assembly"
  - name: assemble-markdown-document
    location: ../../step4 - final paper/script/render/assemble-markdown-document.py
    purpose: "concatenate all domain drafts + cross-cutting content into one Markdown document (section-wise draft, precedes HTML/PDF)"
  - name: assemble-final-document
    location: ../../step4 - final paper/script/render/assemble-final-document.py
    purpose: "concatenate all domain drafts + cross-cutting content into one HTML document"
  - name: render-docx
    location: ../../step4 - final paper/script/render/render-docx.py
    purpose: "convert assembled HTML to DOCX via pandoc"
  - name: render-pdf
    location: ../../step4 - final paper/script/render/render-pdf.py
    purpose: "convert assembled HTML to PDF via Playwright/Chromium"
  - name: extract-mermaid-images
    location: ../../step4 - final paper/script/render/extract-mermaid-images.py
    purpose: "rasterize inline mermaid diagrams to PNG, replace <pre> blocks with <img> tags"
  # --- render-audit-report usecase ---
  - name: generate-audit-report
    location: ../../step4 - final paper/script/render-audit-report/generate_audit_report.py
    purpose: "populate audit report template from score/audit/plagiarism results"
  - name: render-charts
    location: ../../step4 - final paper/script/render-audit-report/render_charts.py
    purpose: "generate chart images from score/audit data (matplotlib Agg backend)"
  # --- propose / approve usecases ---
  - name: gather-proposal-context
    location: ../../common/script/propose/gather_proposal_context.py
    purpose: "gather upstream analysis, rubric info, failing findings, or redraft context for a proposal"
  - name: persist-proposal
    location: ../../common/script/propose/persist_proposal.py
    purpose: "append-only insert of a drafted proposal row (status=pending)"
  - name: link-proposal-scope
    location: ../../common/script/propose/link_proposal_scope.py
    purpose: "link persisted proposal to per-domain scope rows in academic_proposal_scope"
  - name: render-proposal
    location: ../../common/script/propose/render_proposal.py
    purpose: "render a persisted proposal to markdown + html for human review"
  - name: approve-proposal
    location: ../../common/script/propose/approve_proposal.py
    purpose: "human-decision step — flip a pending proposal to approved/rejected"
  - name: archive-proposal
    location: ../../common/script/propose/archive_proposal.py
    purpose: "move a rendered proposal to the archive tree once its implementation is complete"

