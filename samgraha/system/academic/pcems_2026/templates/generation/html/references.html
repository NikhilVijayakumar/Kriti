<section class="domain domain-references">
  <h1>V. REFERENCES</h1>
  <!-- IEEE format: 11/11 sample papers use IEEE; Writing Guide/07 template
       nominally says APA but recommends IEEE based on accepted papers. -->
  <ol class="references-list">
    {{#references}}
    <li id="ref-{{ index }}">
      {{ authors }}. "{{{ title }}}." <em>{{{ journal }}}</em>,
      vol. {{ volume }}, no. {{ issue }}, pp. {{ pages }}, {{ year }}.
      DOI: <a href="https://doi.org/{{ doi }}">{{ doi }}</a>.
    </li>
    {{/references}}
  </ol>
</section>
