# pcems_2026 — human-readable system manifest.
#
# NOTE: The machine-readable manifest for samgraha registration is
# script/schema/standard.yaml (seeder-era format). This file is a
# human-readable companion documenting the domain structure and is NOT
# read by samgraha's MCP tools. See standard.yaml for registration.

name: pcems_2026
abstract: false
description: >
  PCEMS 2026 conference-paper system. 6 domains, single-column manuscript,
  Word-native submission. Content standards sourced from guide/. Originally
  inherited base_academic's shared schema/scripts by directory-fallback
  convention; now a self-contained fork (script/, schema/, prompt/ all
  local) so no standard reaches into another's files.
domains:                                    # scored sections only — matches
  - { key: title-and-metadata, sort_order: 1 } # aggregation/domain + semantic/
  - { key: introduction,       sort_order: 2 } # ensemble scope (§2.4). Cross-
  - { key: methodology,        sort_order: 3 } # cutting domains (novelty, gaps,
  - { key: findings,           sort_order: 4 } # mathematics, tables, figures —
  - { key: conclusion,         sort_order: 5 } # §1.1) are NOT listed here, same
  - { key: references,         sort_order: 6 } # as base_academic's own domains:[]
                                              # never carrying novelty/gaps/mathematics.
