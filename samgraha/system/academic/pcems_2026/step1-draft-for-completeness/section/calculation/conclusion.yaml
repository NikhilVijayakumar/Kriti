id: conclusion
domain: conclusion
checks:
  - id: co-001
    name: word_count_in_range
    rule: word_count_in_range
    severity: critical
    config: { min: 150, max: 400 }
    description: "Conclusion word count within configured range"
  - id: co-002
    name: no_citations
    rule: no_citations
    severity: warning
    description: "No citation markers in conclusion (conclusions synthesize, not cite)"
  - id: co-003
    name: no_new_results
    rule: no_new_results
    severity: critical
    description: "No numeric results not already in findings"
  - id: co-004
    name: length_proportion
    rule: length_proportion
    severity: warning
    config: { compare_to: introduction, max_ratio: 1.5 }
    description: "Conclusion length proportionate to introduction"
  - id: co-005
    name: future_work_present
    rule: regex_match
    severity: warning
    config: { pattern: "(?i)(?:future\\s+work|future\\s+direction|will\\s+be\\s+investigated)" }
    description: "Future work directions present (8/11 sample papers include this)"
  - id: co-006
    name: no_placeholders
    rule: no_placeholders
    severity: critical
    description: "No unfilled template markers"
  - id: conc-bfit
    name: budget_fit_applied
    rule: budget_fit_applied
    severity: info
    description: "stage='budget-fit' narrative row exists for this domain"
  - id: co-ailang
    name: ai_language_flags
    rule: ai_language_flags
    severity: warning
    description: "No AI-generated language flags (Writing Guide/01)"
  - id: co-acrdef
    name: acronym_defined_at_first_use
    rule: acronym_defined_at_first_use
    severity: warning
    description: "Acronyms (2+ uppercase letters) defined before first use"
  - id: co-termcon
    name: terminology_consistency
    rule: terminology_consistency
    severity: warning
    description: "No casing/hyphenation variants of same term"
  - id: co-sentlen
    name: sentence_length_distribution
    rule: sentence_length_distribution
    severity: warning
    config: { min: 15, max: 25 }
    description: "80% of sentences within 15-25 words (Writing Guide/01)"
  - id: co-readability
    name: readability_score_in_range
    rule: readability_score_in_range
    severity: info
    config: { min: 30, max: 60, metric: flesch_reading_ease }
    description: "Flesch reading ease 30-60 (academic prose target)"
