id: novelty
domain: novelty
checks:
  - id: nv-001
    name: word_count_in_range
    rule: word_count_in_range
    severity: critical
    config: { min: 200, max: 600 }
    description: "Novelty word count within configured range"
  - id: nv-002
    name: differentiation_targets
    rule: regex_match
    severity: warning
    config: { pattern: "(?i)(?:propose|introduce|novel|differs.from|unlike|contrast)" }
    description: "Novelty claims have differentiation targets"
  - id: nv-003
    name: no_unqualified_superlatives
    rule: regex_match
    severity: warning
    config: { pattern: "(?i)(?:novel|first|groundbreaking|unprecedented)" }
    description: "Superlatives flagged — must have accompanying differentiation"
  - id: nv-004
    name: no_placeholders
    rule: no_placeholders
    severity: critical
    description: "No unfilled template markers"
  - id: novl-cit
    name: citation_marker_present
    rule: min_citation_count
    severity: critical
    config: { min: 1 }
    description: "Domain contains at least one citation marker"
  - id: novl-bfit
    name: budget_fit_applied
    rule: budget_fit_applied
    severity: info
    description: "stage='budget-fit' narrative row exists for this domain"
  - id: no-ailang
    name: ai_language_flags
    rule: ai_language_flags
    severity: warning
    description: "No AI-generated language flags (Writing Guide/01)"
  - id: nv-acrdef
    name: acronym_defined_at_first_use
    rule: acronym_defined_at_first_use
    severity: warning
    description: "Acronyms (2+ uppercase letters) defined before first use"
  - id: nv-termcon
    name: terminology_consistency
    rule: terminology_consistency
    severity: warning
    description: "No casing/hyphenation variants of same term"
  - id: nv-sentlen
    name: sentence_length_distribution
    rule: sentence_length_distribution
    severity: warning
    config: { min: 15, max: 25 }
    description: "80% of sentences within 15-25 words (Writing Guide/01)"
  - id: nv-readability
    name: readability_score_in_range
    rule: readability_score_in_range
    severity: info
    config: { min: 30, max: 60, metric: flesch_reading_ease }
    description: "Flesch reading ease 30-60 (academic prose target)"
