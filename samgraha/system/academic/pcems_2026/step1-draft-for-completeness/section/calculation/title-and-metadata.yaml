id: title-and-metadata
domain: title-and-metadata
checks:
  - id: tm-001
    name: word_count_in_range
    rule: word_count_in_range
    severity: critical
    config: { min: 10, max: 50 }
    description: "Title word count within configured range (10-15 words target)"
  - id: tm-002
    name: keyword_count
    rule: keyword_count
    severity: critical
    config: { min: 4, max: 6 }
    description: "Keyword count within 4-6 range"
  - id: tm-003
    name: author_block_present
    rule: author_block_present
    severity: critical
    description: "Author/affiliation block exists and is non-empty"
  - id: tm-004
    name: no_placeholders
    rule: no_placeholders
    severity: critical
    description: "No unfilled template markers"
  - id: tm-005
    name: title_no_superlatives
    rule: regex_match
    severity: warning
    config: { pattern: "(?i)(?:novel|first|groundbreaking|unprecedented)" }
    description: "Title flagged for unsupported superlatives"
  - id: tm-006
    name: abstract_word_count_in_range
    rule: abstract_word_count_in_range
    severity: warning
    config: { min: 150, max: 250 }
    description: >
      Abstract word count within 150-250 (target 200, per Writing Guide/01
      and Assets/03-style-card.md). Warning, not critical — per-section
      length is secondary to the whole-paper budget (calculation/report/
      summary/paper-budget.yaml) actually being met.
  - id: tm-bfit
    name: budget_fit_applied
    rule: budget_fit_applied
    severity: info
    description: "stage='budget-fit' narrative row exists for this domain"
  - id: ti-ailang
    name: ai_language_flags
    rule: ai_language_flags
    severity: warning
    description: "No AI-generated language flags (Writing Guide/01)"
  - id: tm-acrdef
    name: acronym_defined_at_first_use
    rule: acronym_defined_at_first_use
    severity: warning
    description: "Acronyms (2+ uppercase letters) defined before first use"
  - id: tm-termcon
    name: terminology_consistency
    rule: terminology_consistency
    severity: warning
    description: "No casing/hyphenation variants of same term"
