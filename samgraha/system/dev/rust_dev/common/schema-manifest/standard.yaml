# rust_dev — samgraha standard manifest.
#
# Rust systems-engineering documentation system: 13 domains across 7 tiers
# (tier 4 intentionally absent — see 00-domain-relationships.md and
# docs/proposal/archive/rust_dev-proposal.md §10 for why).
# Deterministic + semantic audit layer, 25/25/25/25 four-bucket weight
# split (common/calculation/summary/final_score.yaml — see proposal 1 §3
# for why calculation/ lives under common/ rather than per-tier).
#
# Fully self-contained — every scripts:/prompts: location: (once populated)
# points inside rust_dev's own tree (tierN/, common/). No cross-standard
# references. Paths are relative to this file's location
# (common/schema-manifest/).
#
# Status: proposal 2 of 7 (docs/proposal/2-rust_dev-standard-manifest-
# registration-proposal.md), corrected by proposal 6
# (docs/proposal/6-rust_dev-samgraha-schema-alignment-proposal.md).
# `domains:` is real — matches samgraha's generic `domain` table, resolved
# straight from common/plan/core/tiers.yaml, no script dependency.
#
# `usecases:` (proposal 3, docs/proposal/3-rust_dev-calculation-audit-
# usecase-wiring-proposal.md) declares all 53 usecases the calculation/
# audit layer needs (4 per domain — generate-document/deterministic-audit/
# semantic-audit/fix — + 1 cross-tier calculate), each with `steps: []`,
# matching pcems_2026's own "declared but not yet wired" pattern (proposal
# 2 §2) — a valid, load-bearing state. §6's 3 open questions are resolved
# as each usecase's own recommendation stood: gather-tier-context branches
# internally on product-guide's all_domains case rather than forking into a
# separate usecase; deterministic-audit-{domain} covers both document- and
# section-scope rule files in its one step 2, not split into two usecases.
# `scripts:`/`prompts:`/`custom_tables:` stay empty — writing any script or
# prompt content is explicitly proposal 3 §7's out-of-scope list (wrapping
# common/tierN/script/{ubuntu,windows}/*.{sh,ps1} into samgraha's
# --repo-root/--in/--out envelope contract, §4's run-domain-checks family
# most of all). No `smoke_test:` declared yet — nothing to verify-gate
# until real scripts exist. `seeder_script:` IS declared (see below).
#
# `usecases:` also carries proposal 5's propose pipeline (docs/proposal/
# 5-rust_dev-propose-pipeline-proposal.md) — 21 tier-scoped
# `propose-tier{N}-{generation,audit,fix}` usecases, one triad per real
# tier (1,2,3,5,6,7,8 — no tier4, same absence as everywhere else), no
# `domain:` field (spans every domain in the tier, same reasoning as
# `calculate` having none). `steps: []` for the same reason as proposal
# 3's: none of gather-tier-usecase-map/gather-tier-proposal-context/
# persist-proposal/link-proposal-phase-scope/render-proposal exist yet.
# Proposal 5 §4's `dev_proposal_usecase_scope` is superseded by proposal 6
# §6's `dev_proposal_phase_scope` (links real domain/usecase/step ids, not
# proposal 4's dropped `dev_tier_usecase_map`) — neither table exists yet;
# creating them is a seeder.py/proposal 7 concern, same blocker as
# proposal 4's remaining piece.
#
# `usecases:` also carries the repo-state-scoped propose-then-execute
# lifecycle (docs/proposal/8-rust_dev-repo-state-scoped-workflow-
# restructure-proposal.md, superseding proposal 7) — a 3-way repo-state
# split (§4) replaces proposal 7's single branching `propose-tierN-assess`:
# `propose-repo-new-tier{N}` and `propose-repo-existing-tier{N}` per tier
# (§5; `repo_existing_no_doc` reuses `propose-repo-existing-tier{N}`
# unchanged after its one-time cross-tier `bootstrap-readme` usecase) +
# one `bootstrap-readme` (Q1: singular, not tier-structured — an in-depth
# README is one artifact). `migrate-document-{domain}` is dropped entirely
# (§6: a non-conforming existing doc just fails audit and runs the
# ordinary fix-{domain} loop, content-preserving restructuring included).
# None of these carry
# `data: {tier: N}` the way proposal 7's own YAML examples show — proposal
# 6 §2, which proposal 7 depends on, already found `register_standard.rs`'s
# `UsecaseDecl` has no generic `data:` passthrough; an unrecognized `data:`
# key is silently dropped by serde, not stored. `tier` is computed by
# `../script/seeder.py` (see `seeder_script:` below), same as every other
# usecase here.
# `custom_tables:` now has one real entry, `dev_repo_domain_state`
# (proposal 6 §5's design, proposal 7's to build) — the first genuinely
# new table across this whole series.
#
# `custom_tables:` also carries `dev_proposal_phase_scope` (proposal 6 §6
# — designed alongside proposal 5's implementation but never actually
# added to the manifest until now) and 8 findings/score/report tables
# (proposal 6 §7 — a gap the whole series left open: `persist-
# deterministic-findings`/`persist-semantic-score`/`calculate` had no
# table to write to until this pass). Two new cross-tier usecases,
# `render-report`/`render-charts`, mirror pcems's `render-audit-report`/
# `render-charts` pair. Owner decision: proposals stay markdown-only
# (proposal 5 §6 Q3), but findings/scores are DB-backed from the start —
# `render-report`'s markdown output is generated from `dev_*` table data,
# not hand-authored, so a later HTML/PDF/DOCX conversion step (explicitly
# out of scope, proposal 6 §9) has structured data to work from instead of
# re-deriving it from rendered text.
#
# `seeder_script: ../script/seeder.py` now declared, and `../script/
# seeder.py` exists — ported from pcems_2026's own seeder.py (proposal 6
# §1's reference), verified end-to-end against a real knowledge.db
# bootstrapped from samgraha's actual core schema (E:\Python\samgraha\
# schema\knowledge\*.sql), not just eyeballed: creates all 10 `dev_*`
# tables (common/schema/*.sql, via the new common/script/dev_schema.py),
# seeds 13 domains + 91 usecases, correctly resolves `tier` per usecase
# (e.g. `deterministic-audit-security` -> tier 2, `calculate` -> no tier
# key), and is idempotent on re-run (same row counts). Declaring
# `seeder_script:` means this standard's activation now bypasses the
# generic struct-parsing path entirely (proposal 6 §1) — confirmed
# empirically this pass, reading `activate_standard` in
# `register_standard.rs` directly: the struct-parsing `register_standard`
# function it superseded is dead code, not called by the live activation
# path at all, for ANY standard, seeder_script or not. `custom_data_tables`
# rows get populated automatically post-seeder by `activate_standard`
# itself, via `standard.metadata.json` + `PRAGMA table_info` introspection
# — `seeder.py` does not (and must not) insert into `custom_data_tables`.

name: rust_dev
version: "1.0.0"
description: "Rust systems-engineering documentation standard — 13 domains, 7 tiers, deterministic + semantic audit, 25/25/25/25 four-bucket weight split"
seeder_script: ../script/seeder.py

domains:
  - key: vision
    sort_order: 1
    description: "Tier 1 — product vision, problem/solution framing, target audience, platform pillars"
  - key: philosophy
    sort_order: 2
    description: "Tier 1 — guiding principles, values, trade-offs the system is built on"
  - key: security
    sort_order: 3
    description: "Tier 2 — threat model, data classification, security principles, compliance"
  - key: feature
    sort_order: 4
    description: "Tier 2 — functional requirements, business rules, acceptance criteria"
  - key: architecture
    sort_order: 5
    description: "Tier 2 — crate architecture, trait design, system overview, data flow"
  - key: engineering
    sort_order: 6
    description: "Tier 2 — ownership/async/unsafe patterns, build/test/code standards"
  - key: external-context
    sort_order: 7
    description: "Tier 2 — external technology categories, integration contracts, constraints"
  - key: feature-technical
    sort_order: 8
    description: "Tier 3 — participating components, component interactions, data ownership per feature"
  - key: implementation
    sort_order: 9
    description: "Tier 5 — generation/refactor/change-request/enhancement plans, as-built record"
  - key: qa
    sort_order: 10
    description: "Tier 6 — test strategy, unit/integration/E2E/load/security testing"
  - key: build
    sort_order: 11
    description: "Tier 7 — crate publishing, versioning, documentation quality"
  - key: readme
    sort_order: 12
    description: "Tier 8 — project overview, capabilities, repository structure"
  - key: product-guide
    sort_order: 13
    description: "Tier 8 — finished-product usage guide, not part of the derivation graph"

scripts: []

prompts: []

custom_tables:
  # dev_repo_domain_state (proposal 6 §5, built by proposal 8) — one row
  # per (repo_root, domain_key, scan) of the repo-state propose usecases'
  # repo scan. owner_script names scan-tier-repo-state even though that
  # script doesn't exist yet (§4 step 1) — safe: register_standard.rs
  # resolves owner_script via a HashMap lookup into scripts: (empty here),
  # missing names just resolve to no owner_script_id, not an error.
  - table_name: dev_repo_domain_state
    purpose: "one row per (repo_root, domain_key, scan) — doc_exists/conforms/gap_notes from the repo-state propose usecases' structural scan, append-only"
    owner_script: scan-tier-repo-state

  # dev_proposal_phase_scope (proposal 6 §6) — durable link from a
  # proposal row to the real domain/usecase/step ids it was drafted
  # against, since proposal.usecase_id is a singular FK and doesn't fit a
  # propose-tierN-* usecase spanning every domain in a tier.
  - table_name: dev_proposal_phase_scope
    purpose: "per (proposal, phase): domain/usecase/step ids the proposal's phase covers, durable even if the source usecase later changes"
    owner_script: link-proposal-phase-scope

  # --- findings/score/report persistence (proposal 6 §7) — mirrors
  # pcems's academic_deterministic_findings/academic_semantic_*/
  # academic_score_history/academic_visualizations/academic_report_history
  # family, dev_*-prefixed, keyed on repo_root instead of paper_id. ---
  - table_name: dev_deterministic_findings
    purpose: "per (repo_root, domain, scope, run): deterministic audit verdict + findings, from persist-deterministic-findings (proposal 3)"
    owner_script: persist-deterministic-findings
  - table_name: dev_semantic_runs
    purpose: "per (repo_root, domain, scope, model, run): semantic evaluation, from persist-semantic-score (proposal 3)"
    owner_script: persist-semantic-score
  - table_name: dev_semantic_dimension_scores
    purpose: "per-dimension score + evidence for a dev_semantic_runs row"
    owner_script: persist-semantic-score
  - table_name: dev_semantic_findings
    purpose: "per-run strengths/weaknesses/recommendations for a dev_semantic_runs row"
    owner_script: persist-semantic-score
  - table_name: dev_score_history
    purpose: "one row per calculate run (repo_root, domain, final_score, score_band) — trend tracking"
    owner_script: calculate
  - table_name: dev_visualization_types
    purpose: "chart type catalog"
    owner_script: render-charts
  - table_name: dev_visualizations
    purpose: "one row per rendered chart image"
    owner_script: render-charts
  - table_name: dev_report_history
    purpose: "one row per render-report run (repo_root, report_kind, file_path) — markdown output, DB-backed so a later HTML/PDF/DOCX conversion doesn't need to re-derive anything"
    owner_script: render-report

