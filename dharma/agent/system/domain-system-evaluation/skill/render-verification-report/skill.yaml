name: render-verification-report
responsibility: |-
  Render the merged per-domain and system-level verification report from the
  collected verdicts — what passed, what failed, and with what evidence, each
  failed check tagged defect or gap.
is_analysis_only: true
invocation_input_json:
  type: object
  properties:
    verdicts:
      type: array
      description: Collected per-level verdicts with findings and evidence.
      items:
        type: object
  required:
  - verdicts
invocation_output_json:
  type: object
  properties:
    report:
      type: string
      description: The rendered verification report text.
  required:
  - report
prompt_ref: prompt.md
examples_ref: examples
