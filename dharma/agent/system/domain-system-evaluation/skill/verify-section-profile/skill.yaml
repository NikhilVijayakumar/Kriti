name: verify-section-profile
responsibility: |-
  Check one Section Profile's field shape and rule well-formedness —
  writing_objective, knowledge_goal, reader_goal, required_inputs,
  expected_outputs, subsections, completion, review, and validation rules —
  and resolve its references against the owning map.
is_analysis_only: true
invocation_input_json:
  type: object
  properties:
    profile:
      type: object
      description: The Section Profile to check.
    map:
      type: object
      description: The owning Section Map, used to resolve references.
  required:
  - profile
  - map
invocation_output_json:
  type: object
  properties:
    verdict:
      type: string
      enum: [pass, fail]
    findings:
      type: array
      items:
        type: object
        properties:
          id: { type: string }
          condition: { type: string }
          message: { type: string }
          severity: { type: string, enum: [error, warning, info] }
          weight: { type: number }
          mandatory: { type: boolean }
          evidence: { type: string }
          kind: { type: string, enum: [defect, gap] }
  required:
  - verdict
  - findings
prompt_ref: prompt.md
examples_ref: examples
