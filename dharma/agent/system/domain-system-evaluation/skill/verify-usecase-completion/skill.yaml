name: verify-usecase-completion
responsibility: |-
  Evaluate the completion semantics one level up: a usecase is complete ⟺ all
  its tasks are complete AND verified AND the usecase itself is fully verified
  (its user-facing capability is actually delivered — a check above the sum of
  its tasks). The usecase verifier is not the usecase's worker.
is_analysis_only: true
invocation_input_json:
  type: object
  properties:
    usecase:
      type: object
      description: The usecase whose completion is evaluated.
    task_verdicts:
      type: array
      description: Verifier verdicts for each of the usecase's tasks.
      items:
        type: object
  required:
  - usecase
  - task_verdicts
invocation_output_json:
  type: object
  properties:
    verdict:
      type: string
      enum: [pass, fail]
    evidence:
      type: string
      description: The evidence the verdict rests on.
  required:
  - verdict
  - evidence
prompt_ref: prompt.md
examples_ref: examples
