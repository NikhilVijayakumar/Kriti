name: verify-epic-completion
responsibility: |-
  Evaluate the completion semantics at the top level: an epic is complete ⟺
  all its usecases (and their tasks) are complete AND verified AND the epic
  itself is verified (its domain-wide objective is actually satisfied). The
  epic verifier is not the epic's worker.
is_analysis_only: true
invocation_input_json:
  type: object
  properties:
    epic:
      type: object
      description: The epic whose completion is evaluated, with its objective.
    usecase_verdicts:
      type: array
      description: Verifier verdicts for each of the epic's usecases.
      items:
        type: object
  required:
  - epic
  - usecase_verdicts
invocation_output_json:
  type: object
  properties:
    verdict:
      type: string
      enum: [pass, fail]
    evidence:
      type: string
      description: The evidence the verdict rests on.
  required:
  - verdict
  - evidence
prompt_ref: prompt.md
examples_ref: examples
