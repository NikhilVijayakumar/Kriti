name: render-provisioning-report
responsibility: |-
  Render the execution blueprint from the assembled assignments and workflows:
  per-Epic coverage, per-Task assignment, ordered skill invocations, handoff
  chain, verification path, and the classified gap summary.
is_analysis_only: true
invocation_input_json:
  type: object
  properties:
    blueprint:
      type: object
      description: The assembled execution blueprint.
  required:
  - blueprint
invocation_output_json:
  type: object
  properties:
    report:
      type: string
      description: The rendered provisioning report text.
  required:
  - report
prompt_ref: prompt.md
examples_ref: examples
