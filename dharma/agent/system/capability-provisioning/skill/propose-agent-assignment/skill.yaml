name: propose-agent-assignment
responsibility: |-
  Assign a Task to an agent by matching its capabilities to registered Agent
  System concerns and then to that system's agents whose Skill Bindings cover
  the needed skill responsibilities, returning the assignment or an
  unassignable reason.
is_analysis_only: true
invocation_input_json:
  type: object
  properties:
    task:
      type: object
      description: The Task being assigned.
    capabilities:
      type: array
      description: The Task's derived capability set.
    agent_systems:
      type: array
      description: The registered Agent Systems to match against.
      items:
        type: object
  required:
  - task
  - capabilities
  - agent_systems
invocation_output_json:
  type: object
  properties:
    assignment:
      type: object
      description: The proposed assignment (task to owning agent role).
      properties:
        task: { type: string }
        agent_role: { type: string }
        agent_system: { type: string }
        matched_skills: { type: array, items: { type: string } }
    unassignable_reason:
      type: string
      description: Present only when the Task cannot be assigned.
  required:
  - assignment
prompt_ref: prompt.md
examples_ref: examples
