schema:
  id: rust_dev.dharma.domain.engineering.profile.rationale
  name: Technology Selection Section Profile
  version: 0.1.0
source: >-
  common/tier2/audit/deterministic/section/engineering/02-rationale.yaml
section:
  id: rationale
  writing_objective: >-
    Authored placeholder - the rust_dev standard's common/tier2/audit/deterministic/section/engineering/02-rationale.yaml
    carries no Writing Guidance for this section; objective pending human author.
    Section behavior is defined by its 4 deterministic audit rule(s) (see validation.rules).
  knowledge_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  reader_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  required_inputs: []
  expected_outputs:
    primary: []
  subsections: {}
  completion:
    checklist:
    - Rationale section exists
    - Rationale explains why engineering standards exist
    - Rationale references upstream domains
    - Rationale includes trade-offs
  review:
    questions: []
  validation:
    rules:
    - id: eng-sec-rationale-001
      description: Rationale section exists
      condition: document has a section with semantic_type = 'rationale'
      message: Missing required 'Rationale' section
      severity: error
      weight: 1.5
      mandatory: true
      evidence:
        type: section_presence
        semantic_type: rationale
    - id: eng-sec-rationale-002
      description: Rationale explains why engineering standards exist
      condition: section contains justification for the engineering approach
      message: Rationale section does not explain engineering justification
      severity: error
      weight: 1.0
      mandatory: true
      evidence:
        type: content_check
        keywords:
        - because
        - reason
        - justify
        - trade-off
        - rationale
    - id: eng-sec-rationale-003
      description: Rationale references upstream domains
      condition: >-
        section connects engineering decisions to Philosophy or Architecture constraints
      message: Rationale section does not reference upstream domains
      severity: warning
      weight: 0.5
      mandatory: false
      evidence:
        type: content_check
        keywords:
        - philosophy
        - architecture
        - design
        - vision
    - id: eng-sec-rationale-004
      description: Rationale includes trade-offs
      condition: section discusses alternatives considered or trade-offs made
      message: Rationale section does not discuss trade-offs
      severity: warning
      weight: 0.5
      mandatory: false
      evidence:
        type: content_check
        patterns:
        - instead
        - alternative
        - trade-off
        - considered
