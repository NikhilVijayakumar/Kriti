schema:
  id: rust_dev.dharma.domain.external-context.profile.purpose
  name: Purpose Section Profile
  version: 0.1.0
source: >-
  common/tier2/audit/deterministic/section/external-context/01-purpose.yaml
section:
  id: purpose
  writing_objective: >-
    Write the Purpose section, in the third person voice, in paragraphs form, with
    a technical tone, for the architect. Do: State what External Context is in one
    declarative sentence; draw a clear boundary between knowledge dependencies and
    package dependencies; reference the atomic-per-dependency principle explicitly.
    Don't: Describe internal architecture or implementation details; list package
    managers or version numbers; use inspirational or motivational language.
  knowledge_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  reader_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  required_inputs: []
  expected_outputs:
    primary: []
  subsections: {}
  completion:
    checklist:
    - Purpose section exists
    - Purpose states external context intent
    - Purpose is technology-independent
    - Purpose scope boundaries defined
  review:
    questions: []
  validation:
    rules:
    - id: ext-sec-purpose-001
      description: Purpose section exists
      condition: document has a section with semantic_type = 'purpose'
      message: Missing required 'Purpose' section
      severity: error
      weight: 1.5
      mandatory: true
      evidence:
        type: section_presence
        semantic_type: purpose
    - id: ext-sec-purpose-002
      description: Purpose states external context intent
      condition: >-
        section contains a statement of why this external context documentation exists
      message: Purpose section does not state external context intent
      severity: error
      weight: 1.0
      mandatory: true
      evidence:
        type: content_check
        keywords:
        - external
        - context
        - purpose
        - integration
    - id: ext-sec-purpose-003
      description: Purpose is technology-independent
      condition: >-
        section does not reference specific technologies, frameworks, or implementation
        details
      message: >-
        Purpose section contains implementation technology references
      severity: error
      weight: 1.0
      mandatory: true
      evidence:
        type: keyword_absence
        categories:
        - programming_languages
        - frameworks
        - libraries
    - id: ext-sec-purpose-004
      description: Purpose scope boundaries defined
      condition: section defines what the external context is and is not
      message: Purpose section does not define scope boundaries
      severity: warning
      weight: 0.5
      mandatory: false
      evidence:
        type: content_check
        patterns:
        - unlike
        - not
        - does not
