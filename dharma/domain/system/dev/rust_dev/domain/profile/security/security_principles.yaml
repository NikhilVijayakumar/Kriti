schema:
  id: rust_dev.dharma.domain.security.profile.security_principles
  name: Security Principles Section Profile
  version: 0.1.0
source: >-
  common/tier2/audit/deterministic/section/security/03-security_principles.yaml
section:
  id: security_principles
  writing_objective: >-
    Write the Security Principles section, in the imperative voice, in paragraphs
    form, with a prescriptive tone, for the architect. Do: State each principle with
    name, rationale, and at least one example decision it constrains; specialize Philosophy(02)
    guiding principles for the security context; ensure every principle is evaluable
    against a concrete design. Don't: Write generic platitudes ("be secure", "follow
    best practices"); embed specific technology choices or library recommendations;
    list more than seven principles — keep the set focused and memorable.
  knowledge_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  reader_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  required_inputs:
  - Philosophy(02)
  - Threat Model
  expected_outputs:
    primary: []
  subsections: {}
  completion:
    checklist:
    - Security principles section exists
    - Security principles stated clearly
    - Technology-independent principles
    - Principles are prescriptive
    - Principles align with philosophy
    - At least three security principles defined
  review:
    questions: []
  validation:
    rules:
    - id: sec-sec-sp-001
      description: Security principles section exists
      condition: >-
        document has a section with semantic_type = 'security_principles'
      message: Missing required 'Security Principles' section
      severity: error
      weight: 1.5
      mandatory: true
      evidence:
        type: section_presence
        semantic_type: security_principles
    - id: sec-sec-sp-002
      description: Security principles stated clearly
      condition: >-
        each principle is a discrete, numbered or bulleted statement with a clear
        directive
      message: >-
        Security principles are not stated as clear discrete directives
      severity: error
      weight: 1.0
      mandatory: true
      evidence:
        type: content_check
        check: discrete_statements
    - id: sec-sec-sp-003
      description: Technology-independent principles
      condition: >-
        section does not reference specific security technologies, libraries, frameworks,
        or implementation details
      message: Security principles contain technology-specific references
      severity: error
      weight: 1.0
      mandatory: true
      evidence:
        type: keyword_absence
        categories:
        - security_libraries
        - security_frameworks
        - security_tools
        - programming_languages
    - id: sec-sec-sp-004
      description: Principles are prescriptive
      condition: >-
        each principle uses imperative language directing security decisions rather
        than describing current state
      message: >-
        Security principles read as observations rather than directives
      severity: error
      weight: 1.0
      mandatory: true
      evidence:
        type: content_check
        check: prescriptive_not_descriptive
    - id: sec-sec-sp-005
      description: Principles align with philosophy
      condition: >-
        security principles do not contradict the project philosophy guiding principles
      message: Security principles conflict with project philosophy
      severity: warning
      weight: 0.5
      mandatory: false
      evidence:
        type: cross_reference
        expected_section: guiding_principles
        target_domain: philosophy
    - id: sec-sec-sp-006
      description: At least three security principles defined
      condition: section contains at least three distinct security principles
      message: Fewer than three security principles defined
      severity: warning
      weight: 0.5
      mandatory: false
      evidence:
        type: content_check
        check: minimum_count
        count: 3
