schema:
  id: rust_dev.dharma.domain.security.profile.compliance
  name: Compliance Requirements Section Profile
  version: 0.1.0
source: >-
  common/tier2/audit/deterministic/section/security/07-compliance.yaml
section:
  id: compliance
  writing_objective: >-
    Write the Compliance Requirements section, in the third person voice, in tables
    form, with a technical tone, for the architect. Do: Name each compliance regime
    (GDPR, HIPAA, PCI-DSS, SOC 2) explicitly; define scope and applicability per regime;
    trace every obligation to at least one downstream control expectation. Don't:
    Prescribe specific implementation controls (tooling, libraries, configurations);
    skip the obligation-to-control traceability; lump all regimes into a single undifferentiated
    paragraph.
  knowledge_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  reader_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  required_inputs:
  - Threat Model
  - Vision(01)
  expected_outputs:
    primary:
    - per-regime breakdown, obligation-to-control traceability
  subsections: {}
  completion:
    checklist:
    - Compliance section exists
    - Compliance has substantive content
    - Compliance is specific to this project
  review:
    questions: []
  validation:
    rules:
    - id: security-sec-compliance-001
      description: Compliance section exists
      condition: document has a section with semantic_type = 'compliance'
      message: Missing required 'Compliance' section
      severity: error
      weight: 1.5
      mandatory: true
      evidence:
        type: section_presence
        semantic_type: compliance
    - id: security-sec-compliance-002
      description: Compliance has substantive content
      condition: >-
        section contains at least one paragraph of project-specific content
      message: Compliance section is empty or placeholder only
      severity: error
      weight: 1.0
      mandatory: true
      evidence:
        type: content_check
        min_length: 100
    - id: security-sec-compliance-003
      description: Compliance is specific to this project
      condition: >-
        section contains project-specific details, not generic boilerplate
      message: Compliance contains generic content
      severity: warning
      weight: 0.5
      mandatory: false
      evidence:
        type: content_check
        keywords:
        - security
