schema:
  id: rust_dev.dharma.domain.security.profile.constraints
  name: Constraints Section Profile
  version: 0.1.0
source: >-
  common/tier2/audit/deterministic/section/security/05-constraints.yaml
section:
  id: constraints
  writing_objective: >-
    Write the Constraints section, in the imperative voice, in bullet lists form,
    with a prescriptive tone, for the architect. Do: State each constraint as a hard
    boundary expressed as a pass/fail condition; identify which downstream domains
    are affected by each constraint; attribute each constraint to its source (regulatory,
    contractual, infrastructure, organizational). Don't: Embed implementation solutions
    within constraint statements; state soft preferences (performance, convenience)
    as hard constraints; omit source attribution for any listed constraint.
  knowledge_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  reader_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  required_inputs:
  - Vision(01)
  - External Context
  expected_outputs:
    primary: []
  subsections: {}
  completion:
    checklist:
    - Constraints section exists
    - Security constraints stated clearly
    - No implementation technology references
    - Constraints traceable to sources
    - Constraints are testable or verifiable
  review:
    questions: []
  validation:
    rules:
    - id: sec-sec-con-001
      description: Constraints section exists
      condition: document has a section with semantic_type = 'constraints'
      message: Missing required 'Constraints' section
      severity: error
      weight: 1.5
      mandatory: true
      evidence:
        type: section_presence
        semantic_type: constraints
    - id: sec-sec-con-002
      description: Security constraints stated clearly
      condition: >-
        each constraint is a discrete statement defining a boundary or limitation
        on security decisions
      message: >-
        Security constraints are not stated as clear discrete boundaries
      severity: error
      weight: 1.0
      mandatory: true
      evidence:
        type: content_check
        check: discrete_statements
    - id: sec-sec-con-003
      description: No implementation technology references
      condition: >-
        section does not reference specific technologies, frameworks, or implementation
        details
      message: Constraints contain implementation technology references
      severity: error
      weight: 1.0
      mandatory: true
      evidence:
        type: keyword_absence
        categories:
        - programming_languages
        - frameworks
        - libraries
    - id: sec-sec-con-004
      description: Constraints traceable to sources
      condition: >-
        each constraint identifies its source (regulatory, organizational, technical,
        or philosophical)
      message: Constraints lack source attribution
      severity: warning
      weight: 0.5
      mandatory: false
      evidence:
        type: content_check
        check: source_attribution
    - id: sec-sec-con-005
      description: Constraints are testable or verifiable
      condition: >-
        constraints are stated in a way that allows verification of compliance
      message: Constraints are not verifiable
      severity: warning
      weight: 0.5
      mandatory: false
      evidence:
        type: content_check
        check: verifiable_statement
