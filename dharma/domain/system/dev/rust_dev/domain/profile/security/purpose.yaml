schema:
  id: rust_dev.dharma.domain.security.profile.purpose
  name: Purpose Section Profile
  version: 0.1.0
source: >-
  common/tier2/audit/deterministic/section/security/04-purpose.yaml
section:
  id: purpose
  writing_objective: >-
    Write the Purpose section, in the third person voice, in paragraphs form, with
    a prescriptive tone, for the new contributor. Do: State Security's role as the
    single project-wide authority; define the boundary between Security and per-domain
    sections explicitly; reference derivation from Vision(01) and Philosophy(02).
    Don't: Name specific controls, libraries, or tooling; use imperative voice; embed
    implementation details that belong in downstream domains.
  knowledge_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  reader_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  required_inputs:
  - Vision(01)
  - Philosophy(02)
  expected_outputs:
    primary: []
  subsections: {}
  completion:
    checklist:
    - Purpose section exists
    - Purpose states security intent
    - Purpose is technology-independent
    - Purpose scope boundaries defined
  review:
    questions: []
  validation:
    rules:
    - id: sec-sec-purpose-001
      description: Purpose section exists
      condition: document has a section with semantic_type = 'purpose'
      message: Missing required 'Purpose' section
      severity: error
      weight: 1.5
      mandatory: true
      evidence:
        type: section_presence
        semantic_type: purpose
    - id: sec-sec-purpose-002
      description: Purpose states security intent
      condition: >-
        section contains a statement of why Security Documentation exists
      message: Purpose section does not state security intent
      severity: error
      weight: 1.0
      mandatory: true
      evidence:
        type: content_check
        keywords:
        - security
        - threats
        - protection
        - risk
    - id: sec-sec-purpose-003
      description: Purpose is technology-independent
      condition: >-
        section does not reference specific technologies, frameworks, or implementation
        details
      message: >-
        Purpose section contains implementation technology references
      severity: error
      weight: 1.0
      mandatory: true
      evidence:
        type: keyword_absence
        categories:
        - programming_languages
        - frameworks
        - libraries
    - id: sec-sec-purpose-004
      description: Purpose scope boundaries defined
      condition: section defines what Security Documentation is and is not
      message: Purpose section does not define scope boundaries
      severity: warning
      weight: 0.5
      mandatory: false
      evidence:
        type: content_check
        patterns:
        - unlike
        - not
        - does not
