schema:
  id: rust_dev.dharma.domain.security.profile.traceability
  name: Traceability Section Profile
  version: 0.1.0
source: >-
  common/tier2/audit/deterministic/section/security/06-traceability.yaml
section:
  id: traceability
  writing_objective: >-
    Write the Traceability section, in the third person voice, in diagrams form, with
    a structural tone, for the new contributor. Do: Show the full derivation chain
    as a tier diagram; list every downstream domain that consumes Security and how
    it consumes it; state the non-duplication rule explicitly so downstream sections
    reference, not restate. Don't: Omit the tier diagram; list downstream domains
    without explaining their consumption pattern; allow downstream sections to re-derive
    threat models or data classification independently.
  knowledge_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  reader_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  required_inputs:
  - Vision(01)
  - Philosophy(02)
  - Architecture(05)
  - Engineering(07)
  - Feature Technical(10)
  expected_outputs:
    primary:
    - tier diagram, downstream consumers, non-duplication rule
    - tier derivation chain (flowchart or text diagram)
  subsections: {}
  completion:
    checklist:
    - Traceability section exists
    - Threats traceable to vision
    - Data classifications traceable to threats
    - No implementation technology references
    - Bidirectional traceability
  review:
    questions: []
  validation:
    rules:
    - id: sec-sec-tr-001
      description: Traceability section exists
      condition: document has a section with semantic_type = 'traceability'
      message: Missing required 'Traceability' section
      severity: error
      weight: 1.5
      mandatory: true
      evidence:
        type: section_presence
        semantic_type: traceability
    - id: sec-sec-tr-002
      description: Threats traceable to vision
      condition: >-
        section maps threats back to vision-level security goals or concerns
      message: Threats are not traceable to vision-level goals
      severity: error
      weight: 1.0
      mandatory: true
      evidence:
        type: cross_reference
        target_domain: vision
        target_section: vision_statement
    - id: sec-sec-tr-003
      description: Data classifications traceable to threats
      condition: >-
        section shows which data classifications are addressed by which threats and
        mitigations
      message: Data classifications are not linked to threats
      severity: warning
      weight: 0.5
      mandatory: false
      evidence:
        type: cross_reference
        target_domain: security
        target_section: threat_model
    - id: sec-sec-tr-004
      description: No implementation technology references
      condition: >-
        section does not reference specific technologies, frameworks, or implementation
        details
      message: Traceability contains implementation technology references
      severity: error
      weight: 1.0
      mandatory: true
      evidence:
        type: keyword_absence
        categories:
        - programming_languages
        - frameworks
        - libraries
    - id: sec-sec-tr-005
      description: Bidirectional traceability
      condition: >-
        traceability maps work both upstream (to vision/philosophy) and downstream
        (to architecture/engineering)
      message: Traceability is one-directional only
      severity: warning
      weight: 0.5
      mandatory: false
      evidence:
        type: content_check
        check: bidirectional_traceability
