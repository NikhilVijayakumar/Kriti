schema:
  id: rust_dev.dharma.domain.security.profile.incident_response
  name: Incident Response Section Profile
  version: 0.1.0
source: >-
  common/tier2/audit/deterministic/section/security/08-incident_response.yaml
section:
  id: incident_response
  writing_objective: >-
    Write the Incident Response section, in the imperative voice, in paragraphs form,
    with a structural tone, for the engineer. Do: State detection and response expectations
    as outcomes, not tooling; define escalation paths with timeframes and notification
    order; specify recovery objectives (time-to-contain, time-to-restore). Don't:
    Mandate specific SIEM, alerting, or scanning tools; embed on-call rotation details
    or shift schedules; define post-mortem templates or review formats.
  knowledge_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  reader_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  required_inputs:
  - Threat Model
  expected_outputs:
    primary:
    - >-
      detection expectations, response escalation, recovery objectives
    - escalation flowchart
  subsections: {}
  completion:
    checklist:
    - Incident Response section exists
    - Incident Response has substantive content
    - Incident Response is specific to this project
  review:
    questions: []
  validation:
    rules:
    - id: security-sec-incident_response-001
      description: Incident Response section exists
      condition: >-
        document has a section with semantic_type = 'incident_response'
      message: Missing required 'Incident Response' section
      severity: error
      weight: 1.5
      mandatory: true
      evidence:
        type: section_presence
        semantic_type: incident_response
    - id: security-sec-incident_response-002
      description: Incident Response has substantive content
      condition: >-
        section contains at least one paragraph of project-specific content
      message: Incident Response section is empty or placeholder only
      severity: error
      weight: 1.0
      mandatory: true
      evidence:
        type: content_check
        min_length: 100
    - id: security-sec-incident_response-003
      description: Incident Response is specific to this project
      condition: >-
        section contains project-specific details, not generic boilerplate
      message: Incident Response contains generic content
      severity: warning
      weight: 0.5
      mandatory: false
      evidence:
        type: content_check
        keywords:
        - security
