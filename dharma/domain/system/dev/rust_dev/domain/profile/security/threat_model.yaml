schema:
  id: rust_dev.dharma.domain.security.profile.threat_model
  name: Threat Model Section Profile
  version: 0.1.0
source: >-
  common/tier2/audit/deterministic/section/security/01-threat_model.yaml
section:
  id: threat_model
  writing_objective: >-
    Write the Threat Model section, in the third person voice, in tables form, with
    a technical tone, for the architect. Do: Use a named methodology (STRIDE, PASTA,
    or OWASP Threat Modeling) consistently; link each threat to at least one downstream
    mitigation expectation; assign severity to every enumerated threat. Don't: List
    specific tooling or library mitigations; enumerate per-component trust boundaries
    that belong in Architecture; use vague severity labels without justification.
  knowledge_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  reader_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  required_inputs:
  - Data Classification
  - Security Principles
  expected_outputs:
    primary:
    - >-
      methodology, adversary profiles, threat enumeration, attack surfaces, downstream
      expectations
    - threat landscape overview (flowchart or table)
  subsections: {}
  completion:
    checklist:
    - Threat model section exists
    - Threats identified with mitigations
    - No specific security library references
    - Threats categorized or structured
    - Threats reference data classifications
    - At least two threats documented
  review:
    questions: []
  validation:
    rules:
    - id: sec-sec-tm-001
      description: Threat model section exists
      condition: document has a section with semantic_type = 'threat_model'
      message: Missing required 'Threat Model' section
      severity: error
      weight: 1.5
      mandatory: true
      evidence:
        type: section_presence
        semantic_type: threat_model
    - id: sec-sec-tm-002
      description: Threats identified with mitigations
      condition: >-
        each identified threat includes a corresponding mitigation or countermeasure
      message: Threats identified without corresponding mitigations
      severity: error
      weight: 1.0
      mandatory: true
      evidence:
        type: content_check
        check: threat_mitigation_pairs
    - id: sec-sec-tm-003
      description: No specific security library references
      condition: >-
        section does not reference specific security libraries, frameworks, or tooling
      message: >-
        Threat model contains references to specific security libraries or tools
      severity: error
      weight: 1.0
      mandatory: true
      evidence:
        type: keyword_absence
        categories:
        - security_libraries
        - security_frameworks
        - security_tools
    - id: sec-sec-tm-004
      description: Threats categorized or structured
      condition: >-
        threats are organized by category, severity, or attack vector rather than
        listed as an unstructured paragraph
      message: Threats are not organized into a structured format
      severity: warning
      weight: 0.5
      mandatory: false
      evidence:
        type: content_check
        check: structured_listing
    - id: sec-sec-tm-005
      description: Threats reference data classifications
      condition: threats identify which data classifications are affected
      message: Threats do not reference data classifications they affect
      severity: warning
      weight: 0.5
      mandatory: false
      evidence:
        type: cross_reference
        expected_section: data_classification
    - id: sec-sec-tm-006
      description: At least two threats documented
      condition: >-
        section contains at least two distinct threats with mitigations
      message: Fewer than two threats documented
      severity: warning
      weight: 0.5
      mandatory: false
      evidence:
        type: content_check
        check: minimum_count
        count: 2
