schema:
  id: rust_dev.dharma.domain.philosophy.profile.tradeoffs
  name: Trade-offs Section Profile
  version: 0.1.0
source: >-
  common/tier1/audit/deterministic/section/philosophy/03-tradeoffs.yaml
section:
  id: tradeoffs
  writing_objective: >-
    Authored placeholder - the rust_dev standard's common/tier1/audit/deterministic/section/philosophy/03-tradeoffs.yaml
    carries no Writing Guidance for this section; objective pending human author.
    Section behavior is defined by its 6 deterministic audit rule(s) (see validation.rules).
  knowledge_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  reader_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  required_inputs: []
  expected_outputs:
    primary: []
  subsections: {}
  completion:
    checklist:
    - Tradeoffs section exists
    - Tradeoffs documented with reasoning
    - Tradeoffs identify competing concerns
    - Tradeoffs are technology-independent
    - Tradeoffs are not one-sided
    - At least one tradeoff documented
  review:
    questions: []
  validation:
    rules:
    - id: phil-sec-to-001
      description: Tradeoffs section exists
      condition: document has a section with semantic_type = 'tradeoffs'
      message: Missing required 'Tradeoffs' section
      severity: error
      weight: 1.5
      mandatory: true
      evidence:
        type: section_presence
        semantic_type: tradeoffs
    - id: phil-sec-to-002
      description: Tradeoffs documented with reasoning
      condition: >-
        each tradeoff identifies the competing concerns, the chosen direction, and
        the reasoning for the choice
      message: Tradeoffs lack reasoning for the chosen direction
      severity: error
      weight: 1.0
      mandatory: true
      evidence:
        type: content_check
        check: tradeoff_with_reasoning
    - id: phil-sec-to-003
      description: Tradeoffs identify competing concerns
      condition: >-
        each tradeoff explicitly names the two or more concerns being balanced
      message: Tradeoffs do not identify competing concerns
      severity: error
      weight: 1.0
      mandatory: true
      evidence:
        type: content_check
        check: competing_concerns_identified
    - id: phil-sec-to-004
      description: Tradeoffs are technology-independent
      condition: >-
        section does not reference specific technologies, frameworks, or implementation
        details
      message: Tradeoffs contain implementation technology references
      severity: error
      weight: 1.0
      mandatory: true
      evidence:
        type: keyword_absence
        categories:
        - programming_languages
        - frameworks
        - libraries
    - id: phil-sec-to-005
      description: Tradeoffs are not one-sided
      condition: >-
        each tradeoff acknowledges what is lost or deprioritized, not only what is
        gained
      message: >-
        Tradeoffs are presented as one-sided decisions without acknowledging losses
      severity: warning
      weight: 0.5
      mandatory: false
      evidence:
        type: content_check
        check: balanced_tradeoff
    - id: phil-sec-to-006
      description: At least one tradeoff documented
      condition: >-
        section contains at least one documented tradeoff with reasoning
      message: No tradeoffs documented
      severity: warning
      weight: 0.5
      mandatory: false
      evidence:
        type: content_check
        check: minimum_count
        count: 1
