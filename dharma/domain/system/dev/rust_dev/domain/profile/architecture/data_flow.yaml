        section does not describe database schemas, SQL queries, or ORM methods
      message: Data Flow section contains implementation-level data details
      severity: error
      weight: 1.0
      mandatory: true
      evidence:
        type: keyword_absence
        categories:
        - database_schemas
        - sql_queries
        - orm_methods
    - id: arch-sec-df-005
      description: Data flow diagram present
      condition: >-
        section contains or references a data flow diagram covering all major paths
      message: Data Flow section lacks a diagram
      severity: warning
      weight: 0.5
      mandatory: false
      evidence:
        type: diagram_presence
        kinds:
        - flowchart
