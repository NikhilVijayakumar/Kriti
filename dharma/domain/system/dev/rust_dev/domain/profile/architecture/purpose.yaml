schema:
  id: rust_dev.dharma.domain.architecture.profile.purpose
  name: Purpose Section Profile
  version: 0.1.0
source: >-
  common/tier2/audit/deterministic/section/architecture/01-purpose.yaml
section:
  id: purpose
  writing_objective: >-
    Write the Purpose section, in the third person voice, in paragraphs form, with
    a structural tone, for the architect. Do: State what Architecture Documentation
    is and what it is not in the same breath; describe it as a collection rather than
    a single artifact; keep the boundary with Engineering and Feature Technical Design
    explicit. Don't: Name specific components, technologies, or frameworks; describe
    how any particular system is organized; list features or capabilities.
  knowledge_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  reader_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  required_inputs: []
  expected_outputs:
    primary: []
  subsections: {}
  completion:
    checklist:
    - Purpose section exists
    - Purpose states architectural intent
    - Purpose is technology-independent
    - Purpose scope boundaries defined
  review:
    questions: []
  validation:
    rules:
    - id: arch-sec-purpose-001
      description: Purpose section exists
      condition: document has a section with semantic_type = 'purpose'
      message: Missing required 'Purpose' section
      severity: error
      weight: 1.5
      mandatory: true
      evidence:
        type: section_presence
        semantic_type: purpose
    - id: arch-sec-purpose-002
      description: Purpose states architectural intent
      condition: >-
        section contains a statement of why Architecture Documentation exists
      message: Purpose section does not state architectural intent
      severity: error
      weight: 1.0
      mandatory: true
      evidence:
        type: content_check
        keywords:
        - architecture
        - standard
        - documentation
    - id: arch-sec-purpose-003
      description: Purpose is technology-independent
      condition: >-
        section does not reference specific technologies, frameworks, or implementation
        details
      message: >-
        Purpose section contains implementation technology references
      severity: error
      weight: 1.0
      mandatory: true
      evidence:
        type: keyword_absence
        categories:
        - programming_languages
        - frameworks
        - libraries
    - id: arch-sec-purpose-004
      description: Purpose scope boundaries defined
      condition: >-
        section defines what Architecture Documentation is and is not
      message: Purpose section does not define scope boundaries
      severity: warning
      weight: 0.5
      mandatory: false
      evidence:
        type: content_check
        patterns:
        - unlike
        - not
        - does not
