source: >-
  common/tier2/audit/deterministic/section/architecture/03-component_model.yaml
section:
  id: component_model
  writing_objective: >-
    Authored placeholder - the rust_dev standard's common/tier2/audit/deterministic/section/architecture/03-component_model.yaml
    carries no Writing Guidance for this section; objective pending human author.
    Section behavior is defined by its 7 deterministic audit rule(s) (see validation.rules).
  knowledge_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  reader_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  required_inputs: []
  expected_outputs:
    primary: []
  subsections: {}
  completion:
    checklist:
    - Component Model section exists
    - Component Model has required subsections
    - Each component has responsibility defined
    - Each component has ownership defined
    - No overlapping responsibilities
    - Component Model is technology-independent
    - Component relationship diagram present
  review:
    questions: []
  validation:
    rules:
    - id: arch-sec-cm-001
      description: Component Model section exists
      condition: >-
        document has a section with semantic_type = 'component_model'
      message: Missing required 'Component Model' section
      severity: error
      weight: 1.5
      mandatory: true
      evidence:
        type: section_presence
        semantic_type: component_model
    - id: arch-sec-cm-002
      description: Component Model has required subsections
      condition: >-
        section contains Components and Component Diagram subsections
      message: >-
        Component Model is missing required subsections (Components, Component Diagram)
      severity: error
      weight: 1.0
      mandatory: true
      evidence:
        type: subsection_presence
        required:
        - Components
        - Component Diagram
    - id: arch-sec-cm-003
      description: Each component has responsibility defined
      condition: every listed component has a Responsibility field
      message: One or more components lack a defined responsibility
      severity: error
      weight: 1.0
      mandatory: true
      evidence:
        type: field_presence
        per_entry:
          field: Responsibility
    - id: arch-sec-cm-004
      description: Each component has ownership defined
      condition: every listed component has an Ownership field
      message: One or more components lack defined ownership
      severity: error
      weight: 1.0
      mandatory: true
      evidence:
        type: field_presence
        per_entry:
          field: Ownership
    - id: arch-sec-cm-005
      description: No overlapping responsibilities
      condition: >-
        component responsibilities do not overlap — each responsibility is assigned
        to exactly one component
      message: Component responsibilities overlap
      severity: error
      weight: 1.0
      mandatory: true
      evidence:
        type: content_deduplication
        scope: across_components
        field: Responsibility
    - id: arch-sec-cm-006
      description: Component Model is technology-independent
      condition: >-
        section does not describe class hierarchies, function signatures, or implementation
        details
      message: Component Model contains implementation details
      severity: error
      weight: 1.0
      mandatory: true
      evidence:
        type: keyword_absence
        categories:
        - class_hierarchies
        - function_signatures
        - implementation_details
    - id: arch-sec-cm-007
      description: Component relationship diagram present
      condition: >-
        section contains or references a diagram showing component relationships
      message: Component Model lacks a relationship diagram
      severity: warning
      weight: 0.5
      mandatory: false
      evidence:
        type: diagram_presence
        kinds:
        - component
