schema:
  id: rust_dev.dharma.domain.product-guide.profile.title
  name: Title Section Profile
  version: 0.1.0
source: >-
  common/tier8/audit/deterministic/section/product-guide/01-title.yaml
section:
  id: title
  writing_objective: >-
    Write the Title section, in the imperative voice, in paragraphs form, with a structural
    tone, for the engineer. Do: Use the exact command name or concept name as written
    in the shipped product; keep under 60 characters; describe the action, not the
    system. Don't: Use marketing adjectives or superlatives ("Everything You Need
    To Know"); include parenthetical qualifiers or version numbers in the title; use
    "How to" prefix when the command name already implies action.
  knowledge_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  reader_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  required_inputs: []
  expected_outputs:
    primary: []
  subsections: {}
  completion:
    checklist:
    - Title section exists
    - Title is descriptive
    - Title matches document focus
  review:
    questions: []
  validation:
    rules:
    - id: pg-sec-title-001
      description: Title section exists
      condition: document has a section with semantic_type = 'title'
      message: Missing required 'Title' section
      severity: error
      weight: 1.5
      mandatory: true
      evidence:
        type: section_presence
        semantic_type: title
    - id: pg-sec-title-002
      description: Title is descriptive
      condition: >-
        section contains a descriptive title that identifies the product guide topic
      message: Title section is not descriptive
      severity: error
      weight: 1.0
      mandatory: true
      evidence:
        type: content_check
        keywords:
        - guide
        - product
        - tutorial
        - how to
    - id: pg-sec-title-003
      description: Title matches document focus
      condition: title accurately represents the document's content focus
      message: Title does not match document focus
      severity: warning
      weight: 0.5
      mandatory: false
      evidence:
        type: heading_analysis
        check: title_content_alignment
