schema:
  id: rust_dev.dharma.domain.product-guide.profile.purpose
  name: Purpose Section Profile
  version: 0.1.0
source: >-
  common/tier8/audit/deterministic/section/product-guide/03-purpose.yaml
section:
  id: purpose
  writing_objective: >-
    Write the Purpose section, in the second person voice, in paragraphs form, with
    a conversational tone, for the product owner. Do: Write from the reader's perspective
    — "you" language; lead with the benefit or outcome the user gets; keep to one
    sentence or a short paragraph. Don't: Use passive voice or vague phrasing like
    "this topic covers…"; describe internal implementation details or engineering
    rationale; exceed two sentences.
  knowledge_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  reader_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  required_inputs: []
  expected_outputs:
    primary: []
  subsections: {}
  completion:
    checklist:
    - Purpose section exists
    - Purpose states guide intent
    - Purpose defines audience
  review:
    questions: []
  validation:
    rules:
    - id: pg-sec-purpose-001
      description: Purpose section exists
      condition: document has a section with semantic_type = 'purpose'
      message: Missing optional 'Purpose' section
      severity: warning
      weight: 0.5
      mandatory: false
      evidence:
        type: section_presence
        semantic_type: purpose
    - id: pg-sec-purpose-002
      description: Purpose states guide intent
      condition: >-
        section contains a statement of why this product guide exists
      message: Purpose section does not state guide intent
      severity: warning
      weight: 0.5
      mandatory: false
      evidence:
        type: content_check
        keywords:
        - purpose
        - intent
        - guide
        - help
    - id: pg-sec-purpose-003
      description: Purpose defines audience
      condition: section defines the target audience for this guide
      message: Purpose section does not define target audience
      severity: warning
      weight: 0.5
      mandatory: false
      evidence:
        type: content_check
        patterns:
        - audience
        - user
        - developer
        - reader
