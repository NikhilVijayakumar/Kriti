schema:
  id: rust_dev.dharma.domain.vision.profile.purpose
  name: Purpose Section Profile
  version: 0.1.0
source: >-
  common/tier1/audit/deterministic/section/vision/01-purpose.yaml
section:
  id: purpose
  writing_objective: >-
    Write the Purpose section, in the third person voice, in paragraphs form, with
    an inspirational tone, for the new contributor. Do: Write from the user's world,
    not the engineer's; anchor the purpose in the problem space; keep the language
    stable enough to survive technology changes. Don't: Name programming languages,
    frameworks, or infrastructure; describe what the product does or how it works;
    use jargon that requires domain expertise to understand.
  knowledge_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  reader_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  required_inputs: []
  expected_outputs:
    primary: []
  subsections: {}
  completion:
    checklist:
    - Purpose section exists
    - Purpose states vision intent
    - Purpose is technology-independent
    - Purpose scope boundaries defined
  review:
    questions: []
  validation:
    rules:
    - id: vis-sec-purpose-001
      description: Purpose section exists
      condition: document has a section with semantic_type = 'purpose'
      message: Missing required 'Purpose' section
      severity: error
      weight: 1.5
      mandatory: true
      evidence:
        type: section_presence
        semantic_type: purpose
    - id: vis-sec-purpose-002
      description: Purpose states vision intent
      condition: >-
        section contains a statement of why Vision Documentation exists
      message: Purpose section does not state vision intent
      severity: error
      weight: 1.0
      mandatory: true
      evidence:
        type: content_check
        keywords:
        - vision
        - purpose
        - product
    - id: vis-sec-purpose-003
      description: Purpose is technology-independent
      condition: >-
        section does not reference specific technologies, frameworks, or implementation
        details
      message: >-
        Purpose section contains implementation technology references
      severity: error
      weight: 1.0
      mandatory: true
      evidence:
        type: keyword_absence
        categories:
        - programming_languages
        - frameworks
        - libraries
    - id: vis-sec-purpose-004
      description: Purpose scope boundaries defined
      condition: section defines what Vision Documentation is and is not
      message: Purpose section does not define scope boundaries
      severity: warning
      weight: 0.5
      mandatory: false
      evidence:
        type: content_check
        patterns:
        - unlike
        - not
        - does not
