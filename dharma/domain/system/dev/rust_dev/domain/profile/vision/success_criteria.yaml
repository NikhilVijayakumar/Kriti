schema:
  id: rust_dev.dharma.domain.vision.profile.success_criteria
  name: Success Criteria Section Profile
  version: 0.1.0
source: >-
  common/tier1/audit/deterministic/section/vision/09-success_criteria.yaml
section:
  id: success_criteria
  writing_objective: >-
    Write the Success Criteria section, in the third person voice, in bullet lists
    form, with a prescriptive tone, for the product owner. Do: Write each criterion
    as a measurable or evaluable outcome; tie every criterion directly to the Vision
    statement; use concrete units of measure where possible. Don't: Describe technical
    benchmarks like latency or throughput; include test coverage or deployment frequency;
    list more than six criteria.
  knowledge_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  reader_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  required_inputs:
  - Vision
  - Purpose
  expected_outputs:
    primary: []
  subsections: {}
  completion:
    checklist:
    - Success Criteria section exists
    - Success Criteria are technology-independent
    - Success Criteria are measurable
  review:
    questions: []
  validation:
    rules:
    - id: vis-sec-sc-001
      description: Success Criteria section exists
      condition: >-
        document has a section with semantic_type = 'success_criteria'
      message: Missing optional 'Success Criteria' section
      severity: warning
      weight: 0.3
      mandatory: false
      evidence:
        type: section_presence
        semantic_type: success_criteria
    - id: vis-sec-sc-002
      description: Success Criteria are technology-independent
      condition: >-
        section does not reference specific technologies, frameworks, or implementation
        details
      message: >-
        Success Criteria section contains implementation technology references
      severity: warning
      weight: 0.5
      mandatory: false
      evidence:
        type: keyword_absence
        categories:
        - programming_languages
        - frameworks
        - libraries
    - id: vis-sec-sc-003
      description: Success Criteria are measurable
      condition: section includes quantifiable or verifiable success metrics
      message: Success Criteria section lacks measurable criteria
      severity: warning
      weight: 0.5
      mandatory: false
      evidence:
        type: content_check
        patterns:
        - \d+
        - percent
        - measure
        - metric
        - KPI
        - target
