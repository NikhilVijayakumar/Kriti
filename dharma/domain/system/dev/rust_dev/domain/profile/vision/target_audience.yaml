schema:
  id: rust_dev.dharma.domain.vision.profile.target_audience
  name: Target Audience Section Profile
  version: 0.1.0
source: >-
  common/tier1/audit/deterministic/section/vision/05-target_audience.yaml
section:
  id: target_audience
  writing_objective: >-
    Write the Target Audience section, in the third person voice, in paragraphs form,
    with a conversational tone, for the product owner. Do: Describe audiences by their
    goals, pain points, and decision-making criteria; distinguish between end users
    and decision-makers; include what each audience expects from the product. Don't:
    List programming skills, tool proficiencies, or job titles as the defining trait;
    write user stories or persona cards; conflate technical users with the primary
    audience.
  knowledge_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  reader_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  required_inputs:
  - Purpose
  expected_outputs:
    primary: []
  subsections: {}
  completion:
    checklist:
    - Target Audience section exists
    - Target Audience identifies who the product serves
    - Target Audience is technology-independent
    - Target Audience includes at least two audience segments
  review:
    questions: []
  validation:
    rules:
    - id: vis-sec-ta-001
      description: Target Audience section exists
      condition: >-
        document has a section with semantic_type = 'target_audience'
      message: Missing required 'Target Audience' section
      severity: error
      weight: 1.5
      mandatory: true
      evidence:
        type: section_presence
        semantic_type: target_audience
    - id: vis-sec-ta-002
      description: Target Audience identifies who the product serves
      condition: >-
        section clearly identifies the primary users, customers, or beneficiaries
      message: >-
        Target Audience section does not identify who the product serves
      severity: error
      weight: 1.0
      mandatory: true
      evidence:
        type: content_check
        keywords:
        - user
        - customer
        - audience
        - beneficiary
        - stakeholder
        - persona
        - segment
    - id: vis-sec-ta-003
      description: Target Audience is technology-independent
      condition: >-
        section does not reference specific technologies, tools, or technical skill
        requirements
      message: >-
        Target Audience section contains technology-specific references
      severity: error
      weight: 1.0
      mandatory: true
      evidence:
        type: keyword_absence
        categories:
        - programming_languages
        - frameworks
        - libraries
    - id: vis-sec-ta-004
      description: Target Audience includes at least two audience segments
      condition: section identifies two or more distinct audience groups
      message: >-
        Target Audience section should identify multiple audience segments
      severity: warning
      weight: 0.5
      mandatory: false
      evidence:
        type: content_check
        patterns:
        - also
        - additionally
        - secondary
        - primary
        - and
