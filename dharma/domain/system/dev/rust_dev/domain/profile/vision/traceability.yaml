schema:
  id: rust_dev.dharma.domain.vision.profile.traceability
  name: Traceability Section Profile
  version: 0.1.0
source: >-
  common/tier1/audit/deterministic/section/vision/10-traceability.yaml
section:
  id: traceability
  writing_objective: >-
    Write the Traceability section, in the imperative voice, in diagrams form, with
    a technical tone, for the architect. Do: Include a tier diagram showing the derivation
    hierarchy; list every downstream standard that derives from Vision; state the
    non-contradiction rule explicitly. Don't: Reference source code files, CI/CD pipelines,
    or infrastructure artifacts; omit standards from the diagram; use prose where
    a diagram would be clearer.
  knowledge_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  reader_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  required_inputs:
  - all downstream standards listed
  expected_outputs:
    primary:
    - tier diagram
    - tier hierarchy flowchart
  subsections: {}
  completion:
    checklist:
    - Traceability section exists
    - Traceability links to upstream origins
    - Traceability links to downstream consumers
  review:
    questions: []
  validation:
    rules:
    - id: vis-sec-trace-001
      description: Traceability section exists
      condition: document has a section with semantic_type = 'traceability'
      message: Missing optional 'Traceability' section
      severity: warning
      weight: 0.3
      mandatory: false
      evidence:
        type: section_presence
        semantic_type: traceability
    - id: vis-sec-trace-002
      description: Traceability links to upstream origins
      condition: >-
        section documents the origin or inspiration source for the vision
      message: Traceability section does not document upstream origins
      severity: warning
      weight: 0.5
      mandatory: false
      evidence:
        type: content_check
        keywords:
        - origin
        - source
        - inspiration
        - derived
        - traceable
    - id: vis-sec-trace-003
      description: Traceability links to downstream consumers
      condition: >-
        section lists downstream domains that consume this vision (Philosophy, Feature,
        Security)
      message: Traceability section does not document downstream consumers
      severity: warning
      weight: 0.5
      mandatory: false
      evidence:
        type: content_check
        keywords:
        - philosophy
        - feature
        - security
        - downstream
        - consumer
