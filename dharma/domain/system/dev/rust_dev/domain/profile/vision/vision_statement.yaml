schema:
  id: rust_dev.dharma.domain.vision.profile.vision_statement
  name: Vision Section Profile
  version: 0.1.0
source: >-
  common/tier1/audit/deterministic/section/vision/02-vision_statement.yaml
section:
  id: vision_statement
  writing_objective: >-
    Write the Vision section, in the third person voice, in paragraphs form, with
    an inspirational tone, for the product owner. Do: Paint a vivid picture of the
    fully realized product state; write in the future tense with aspirational language;
    tie the vision back to the Purpose section's "why". Don't: Mention specific technologies,
    release timelines, or implementation milestones; describe current product state
    or features; use metrics or benchmarks that belong in Success Criteria.
  knowledge_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  reader_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  required_inputs:
  - Purpose
  expected_outputs:
    primary: []
  subsections: {}
  completion:
    checklist:
    - Vision Statement section exists
    - Vision Statement describes long-term direction
    - Vision Statement is technology-independent
    - Vision Statement is concise
  review:
    questions: []
  validation:
    rules:
    - id: vis-sec-vs-001
      description: Vision Statement section exists
      condition: >-
        document has a section with semantic_type = 'vision_statement'
      message: Missing required 'Vision Statement' section
      severity: error
      weight: 1.5
      mandatory: true
      evidence:
        type: section_presence
        semantic_type: vision_statement
    - id: vis-sec-vs-002
      description: Vision Statement describes long-term direction
      condition: >-
        section contains a forward-looking statement describing the product's desired
        future state
      message: Vision Statement does not describe long-term direction
      severity: error
      weight: 1.0
      mandatory: true
      evidence:
        type: content_check
        keywords:
        - vision
        - goal
        - direction
        - future
        - aim
        - aspiration
    - id: vis-sec-vs-003
      description: Vision Statement is technology-independent
      condition: >-
        section does not reference specific technologies, frameworks, languages, or
        implementation approaches
      message: Vision Statement contains technology-specific references
      severity: error
      weight: 1.0
      mandatory: true
      evidence:
        type: keyword_absence
        categories:
        - programming_languages
        - frameworks
        - libraries
        - protocols
        - database_schemas
    - id: vis-sec-vs-004
      description: Vision Statement is concise
      condition: section is no longer than 500 words
      message: Vision Statement is excessively long; consider condensing
      severity: warning
      weight: 0.3
      mandatory: false
      evidence:
        type: word_count
        max: 500
