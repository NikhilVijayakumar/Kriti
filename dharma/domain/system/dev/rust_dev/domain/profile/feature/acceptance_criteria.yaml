      description: Acceptance criteria are testable
      condition: >-
        each criterion is phrased as a concrete, verifiable condition
      message: Acceptance criteria are not testable
      severity: error
      weight: 1.0
      mandatory: true
      evidence:
        type: content_check
        keywords:
        - given
        - when
        - then
        - expected
        - pass
        - fail
        - test
