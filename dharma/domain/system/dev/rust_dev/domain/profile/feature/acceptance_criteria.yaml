      description: Acceptance criteria are technology-independent
      condition: >-
        criteria describe observable behavior, not implementation details
      message: >-
        Acceptance criteria contain implementation technology references
      severity: error
      weight: 1.0
      mandatory: true
      evidence:
        type: keyword_absence
        categories:
        - programming_languages
        - frameworks
        - libraries
