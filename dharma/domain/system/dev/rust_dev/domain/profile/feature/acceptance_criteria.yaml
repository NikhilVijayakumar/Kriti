  validation:
    rules:
    - id: feat-sec-ac-001
      description: Acceptance criteria section exists
      condition: >-
        document has a section with semantic_type = 'acceptance_criteria'
      message: Missing required 'Acceptance Criteria' section
      severity: error
      weight: 1.5
