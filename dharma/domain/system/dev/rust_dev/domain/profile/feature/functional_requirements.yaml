      description: Requirements are listed individually
      condition: >-
        section contains at least two distinct requirements, each clearly stated
      message: Functional requirements are not listed individually
      severity: error
      weight: 1.0
      mandatory: true
      evidence:
        type: content_check
        min_count: 2
        patterns:
        - shall
        - must
        - will
        - REQ-
