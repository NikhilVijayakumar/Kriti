      description: Each requirement is testable
      condition: >-
        each requirement can be verified through a concrete test or observation
      message: Some requirements are not testable or verifiable
      severity: warning
      weight: 0.5
      mandatory: false
      evidence:
        type: content_check
        keywords:
        - given
        - when
        - then
        - test
        - verify
        - assert
    - id: feat-sec-freq-004
      description: Requirements are technology-independent
      condition: >-
        requirements describe what the feature does, not how it is implemented
      message: Functional requirements contain implementation details
      severity: error
      weight: 1.0
      mandatory: true
      evidence:
        type: keyword_absence
        categories:
        - programming_languages
        - frameworks
        - libraries
