schema:
  id: >-
    rust_dev.dharma.domain.feature-technical.profile.feature_specification
  name: Feature Specification Section Profile
  version: 0.1.0
source: >-
  common/tier3/audit/deterministic/section/feature-technical/05-feature_specification.yaml
section:
  id: feature_specification
  writing_objective: >-
    Write the Feature Specification section, in the third person voice, in paragraphs
    form, with a structural tone, for the architect. Do: Reference the Feature by
    exact name; confirm scope alignment between Feature and this design; state that
    no additional features are addressed. Don't: Duplicate Feature requirements, acceptance
    criteria, or user stories; paraphrase Feature content; list multiple Feature Specifications.
  knowledge_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  reader_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  required_inputs:
  - Feature(04)
  expected_outputs:
    primary: []
  subsections: {}
  completion:
    checklist:
    - Feature Specification section exists
    - Feature Specification defines technical behavior
    - Feature Specification is technology-independent
  review:
    questions: []
  validation:
    rules:
    - id: ft-sec-spec-001
      description: Feature Specification section exists
      condition: >-
        document has a section with semantic_type = 'feature_specification'
      message: Missing optional 'Feature Specification' section
      severity: info
      weight: 0.3
      mandatory: false
      evidence:
        type: section_presence
        semantic_type: feature_specification
    - id: ft-sec-spec-002
      description: Feature Specification defines technical behavior
      condition: >-
        section contains the technical specification of the feature behavior
      message: >-
        Feature Specification section does not define technical behavior
      severity: warning
      weight: 0.5
      mandatory: false
      evidence:
        type: content_check
        keywords:
        - specification
        - behavior
        - technical
        - interface
        - contract
    - id: ft-sec-spec-003
      description: Feature Specification is technology-independent
      condition: >-
        section does not reference specific technologies, frameworks, or implementation
        details
      message: >-
        Feature Specification section contains implementation technology references
      severity: error
      weight: 1.0
      mandatory: false
      evidence:
        type: keyword_absence
        categories:
        - programming_languages
        - frameworks
        - libraries
