section:
  id: failure_handling
  writing_objective: >-
    Write the Failure Handling section, in the imperative voice, in mixed form, with
    a technical tone, for the engineer. Do: Define failure modes for every component
    interaction; trace error propagation paths across architectural boundaries; state
    recovery strategies and resilience boundaries; include a flowchart. Don't: Name
    specific exception types, error codes, or try/catch patterns; describe retry implementations
    or logging frameworks; reference code locations.
  knowledge_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  reader_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  required_inputs:
  - Component Interactions
  - Architecture(05) error boundaries
  - Component Responsibilities
  expected_outputs:
    primary:
    - flowchart showing error propagation and recovery paths
  subsections: {}
  completion:
    checklist:
    - Failure Handling section exists
    - Failure Handling defines failure modes
    - Failure Handling is technology-independent
  review:
    questions: []
  validation:
    rules:
    - id: ft-sec-failure-001
      description: Failure Handling section exists
      condition: >-
        document has a section with semantic_type = 'failure_handling'
      message: Missing optional 'Failure Handling' section
      severity: info
