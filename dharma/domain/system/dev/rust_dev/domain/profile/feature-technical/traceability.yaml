schema:
  id: >-
    rust_dev.dharma.domain.feature-technical.profile.traceability
  name: Traceability Section Profile
  version: 0.1.0
source: >-
  common/tier3/audit/deterministic/section/feature-technical/17-traceability.yaml
section:
  id: traceability
  writing_objective: >-
    Write the Traceability section, in the third person voice, in mixed form, with
    a structural tone, for the architect. Do: Show the full derivation chain from
    Vision through Feature to Implementation; assert one-to-one mapping with Feature
    Specification; reference Architecture and External Context as inputs; include
    a flowchart. Don't: Trace to source code or implementation artifacts; omit upstream
    or downstream standards; leave the one-to-one mapping unstated.
  knowledge_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  reader_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  required_inputs:
  - Vision(01)
  - Feature(04)
  - Architecture(05)
  - Engineering(07)
  - External Context(08)
  expected_outputs:
    primary:
    - flowchart showing derivation chain
  subsections: {}
  completion:
    checklist:
    - Traceability section exists
    - Traceability links to upstream domains
    - Traceability links to downstream implementation
  review:
    questions: []
  validation:
    rules:
    - id: ft-sec-trace-001
      description: Traceability section exists
      condition: document has a section with semantic_type = 'traceability'
      message: Missing optional 'Traceability' section
      severity: info
      weight: 0.3
      mandatory: false
      evidence:
        type: section_presence
        semantic_type: traceability
    - id: ft-sec-trace-002
      description: Traceability links to upstream domains
      condition: >-
        section contains references back to Feature, Engineering, Architecture, or
        External Context that informed the technical specification
      message: Traceability section does not link to upstream domains
      severity: warning
      weight: 0.5
      mandatory: false
      evidence:
        type: content_check
        keywords:
        - derived from
        - informed by
        - traceable
        - links to
    - id: ft-sec-trace-003
      description: Traceability links to downstream implementation
      condition: >-
        section contains forward references to Implementation that consume this technical
        specification
      message: >-
        Traceability section does not link to downstream implementation
      severity: warning
      weight: 0.5
      mandatory: false
      evidence:
        type: content_check
        keywords:
        - implemented by
        - consumed by
        - realized in
        - applied to
