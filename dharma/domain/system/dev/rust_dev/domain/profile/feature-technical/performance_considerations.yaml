schema:
  id: >-
    rust_dev.dharma.domain.feature-technical.profile.performance_considerations
  name: Performance Considerations Section Profile
  version: 0.1.0
source: >-
  common/tier3/audit/deterministic/section/feature-technical/14-performance_considerations.yaml
section:
  id: performance_considerations
  writing_objective: >-
    Write the Performance Considerations section, in the imperative voice, in bullet
    lists form, with a technical tone, for the architect. Do: State performance expectations
    as architectural constraints traceable to Feature Specification; define throughput,
    latency, and resource expectations at the system level; reference Architecture
    performance patterns. Don't: Provide specific latency numbers or benchmarks; name
    profiling tools or caching libraries; describe optimization techniques or implementation
    strategies.
  knowledge_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  reader_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  required_inputs:
  - Feature Specification
  - Architecture(05) performance patterns
  expected_outputs:
    primary: []
  subsections: {}
  completion:
    checklist:
    - Performance Considerations section exists
    - Performance Considerations defines performance aspects
    - Performance Considerations has measurable targets
  review:
    questions: []
  validation:
    rules:
    - id: ft-sec-perf-001
      description: Performance Considerations section exists
      condition: >-
        document has a section with semantic_type = 'performance_considerations'
      message: Missing optional 'Performance Considerations' section
      severity: info
      weight: 0.3
      mandatory: false
      evidence:
        type: section_presence
        semantic_type: performance_considerations
    - id: ft-sec-perf-002
      description: Performance Considerations defines performance aspects
      condition: >-
        section contains performance considerations such as latency targets, throughput
        requirements, or optimization strategies
      message: >-
        Performance Considerations section does not define performance aspects
      severity: warning
      weight: 0.5
      mandatory: false
      evidence:
        type: content_check
        keywords:
        - performance
        - latency
        - throughput
        - optimize
        - cache
        - efficiency
    - id: ft-sec-perf-003
      description: Performance Considerations has measurable targets
      condition: section defines measurable performance targets or thresholds
      message: >-
        Performance Considerations section does not define measurable targets
      severity: warning
      weight: 0.5
      mandatory: false
      evidence:
        type: content_check
        patterns:
        - \d+
        - ms
        - mb
        - percent
        - threshold
