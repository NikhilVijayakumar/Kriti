schema:
  id: >-
    rust_dev.dharma.domain.feature-technical.profile.participating_components
  name: Participating Components Section Profile
  version: 0.1.0
source: >-
  common/tier3/audit/deterministic/section/feature-technical/02-participating_components.yaml
section:
  id: participating_components
  writing_objective: >-
    Write the Participating Components section, in the imperative voice, in tables
    form, with a technical tone, for the architect. Do: Use component names from Architecture
    Documentation; state the reason each component participates in this specific feature;
    include a component diagram. Don't: List technologies, frameworks, or library
    names; describe component internals; include components not directly involved
    in the feature.
  knowledge_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  reader_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  required_inputs:
  - Architecture(05) component model
  - Feature Specification
  expected_outputs:
    primary:
    - component diagram showing participating components
  subsections: {}
  completion:
    checklist:
    - Participating Components section exists
    - Participating Components lists components
    - Participating Components is technology-independent
    - Participating Components defines component boundaries
  review:
    questions: []
  validation:
    rules:
    - id: ft-sec-components-001
      description: Participating Components section exists
      condition: >-
        document has a section with semantic_type = 'participating_components'
      message: Missing required 'Participating Components' section
      severity: error
      weight: 1.5
      mandatory: true
      evidence:
        type: section_presence
        semantic_type: participating_components
    - id: ft-sec-components-002
      description: Participating Components lists components
      condition: >-
        section contains a list or description of components that participate in the
        feature
      message: Participating Components section does not list components
      severity: error
      weight: 1.0
      mandatory: true
      evidence:
        type: content_check
        keywords:
        - component
        - module
        - service
        - layer
        - boundary
    - id: ft-sec-components-003
      description: Participating Components is technology-independent
      condition: >-
        section does not name specific technologies, frameworks, or implementation
        details
      message: >-
        Participating Components section contains implementation technology references
      severity: error
      weight: 1.0
      mandatory: true
      evidence:
        type: keyword_absence
        categories:
        - programming_languages
        - frameworks
        - libraries
    - id: ft-sec-components-004
      description: Participating Components defines component boundaries
      condition: >-
        section defines the responsibility boundary of each listed component
      message: >-
        Participating Components section does not define component boundaries
      severity: warning
      weight: 0.5
      mandatory: false
      evidence:
        type: content_check
        keywords:
        - responsible for
        - boundary
        - scope
        - owns
        - handles
