schema:
  id: >-
    rust_dev.dharma.domain.feature-technical.profile.runtime_constraints
  name: Runtime Constraints Section Profile
  version: 0.1.0
source: >-
  common/tier3/audit/deterministic/section/feature-technical/11-runtime_constraints.yaml
section:
  id: runtime_constraints
  writing_objective: >-
    Write the Runtime Constraints section, in the imperative voice, in bullet lists
    form, with a technical tone, for the architect. Do: State each constraint as a
    clear operational limitation; cite the source from Architecture or External Context;
    explain how the constraint applies to this specific feature. Don't: Specify implementation
    tools, frameworks, or configuration files; provide performance benchmarks or numerical
    thresholds; describe deployment or infrastructure details.
  knowledge_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  reader_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  required_inputs:
  - Architecture(05) runtime boundaries
  - External Context(08)
  expected_outputs:
    primary: []
  subsections: {}
  completion:
    checklist:
    - Runtime Constraints section exists
    - Runtime Constraints defines constraints
    - Runtime Constraints has measurable thresholds
  review:
    questions: []
  validation:
    rules:
    - id: ft-sec-rtcon-001
      description: Runtime Constraints section exists
      condition: >-
        document has a section with semantic_type = 'runtime_constraints'
      message: Missing optional 'Runtime Constraints' section
      severity: info
      weight: 0.3
      mandatory: false
      evidence:
        type: section_presence
        semantic_type: runtime_constraints
    - id: ft-sec-rtcon-002
      description: Runtime Constraints defines constraints
      condition: >-
        section contains constraints on runtime behavior such as latency, throughput,
        memory, or availability
      message: >-
        Runtime Constraints section does not define runtime constraints
      severity: warning
      weight: 0.5
      mandatory: false
      evidence:
        type: content_check
        keywords:
        - latency
        - throughput
        - memory
        - availability
        - timeout
        - limit
    - id: ft-sec-rtcon-003
      description: Runtime Constraints has measurable thresholds
      condition: >-
        section defines measurable thresholds or targets for each constraint
      message: >-
        Runtime Constraints section does not define measurable thresholds
      severity: warning
      weight: 0.5
      mandatory: false
      evidence:
        type: content_check
        patterns:
        - \d+
        - ms
        - mb
        - percent
        - threshold
