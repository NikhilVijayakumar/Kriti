schema:
  id: >-
    rust_dev.dharma.domain.feature-technical.profile.external_dependencies
  name: External Dependency Integration Section Profile
  version: 0.1.0
source: >-
  common/tier3/audit/deterministic/section/feature-technical/10-external_dependencies.yaml
section:
  id: external_dependencies
  writing_objective: >-
    Write the External Dependency Integration section, in the imperative voice, in
    bullet lists form, with a technical tone, for the architect. Do: Reference External
    Context documents by name; state the role of each dependency in the feature; describe
    constraints imposed without duplicating External Context content; include a component
    diagram. Don't: Duplicate External Context content; describe SDK versions or library
    APIs; specify implementation-level integration patterns.
  knowledge_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  reader_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  required_inputs:
  - External Context(08)
  - Integration Points
  expected_outputs:
    primary:
    - component diagram showing external dependencies
  subsections: {}
  completion:
    checklist:
    - External Dependencies section exists
    - External Dependencies lists dependencies
    - External Dependencies defines dependency nature
  review:
    questions: []
  validation:
    rules:
    - id: ft-sec-extdep-001
      description: External Dependencies section exists
      condition: >-
        document has a section with semantic_type = 'external_dependencies'
      message: Missing optional 'External Dependencies' section
      severity: info
      weight: 0.3
      mandatory: false
      evidence:
        type: section_presence
        semantic_type: external_dependencies
    - id: ft-sec-extdep-002
      description: External Dependencies lists dependencies
      condition: >-
        section contains a list of external systems, services, or libraries the feature
        depends on
      message: External Dependencies section does not list dependencies
      severity: warning
      weight: 0.5
      mandatory: false
      evidence:
        type: content_check
        keywords:
        - dependency
        - depends
        - requires
        - external
        - third-party
    - id: ft-sec-extdep-003
      description: External Dependencies defines dependency nature
      condition: >-
        section specifies the nature of each dependency (required, optional, version
        constraints)
      message: >-
        External Dependencies section does not define dependency nature
      severity: warning
      weight: 0.5
      mandatory: false
      evidence:
        type: content_check
        keywords:
        - required
        - optional
        - version
        - minimum
        - constraint
