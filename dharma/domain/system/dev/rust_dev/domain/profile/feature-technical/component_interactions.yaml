schema:
  id: >-
    rust_dev.dharma.domain.feature-technical.profile.component_interactions
  name: Component Interactions Section Profile
  version: 0.1.0
source: >-
  common/tier3/audit/deterministic/section/feature-technical/03-component_interactions.yaml
section:
  id: component_interactions
  writing_objective: >-
    Write the Component Interactions section, in the imperative voice, in bullet lists
    form, with a technical tone, for the engineer. Do: State the triggering condition,
    nature of exchange, and expected outcome for each interaction; trace every interaction
    to a Feature Specification behavior; include a sequence diagram. Don't: Name specific
    classes, methods, or API endpoints; describe serialization formats or protocols;
    use implementation-level communication details.
  knowledge_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  reader_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  required_inputs:
  - Participating Components
  - Feature Specification
  - Architecture(05) communication model
  expected_outputs:
    primary:
    - sequence diagram showing component interactions
  subsections: {}
  completion:
    checklist:
    - Component Interactions section exists
    - Component Interactions describes interactions
    - Component Interactions is technology-independent
    - Component Interactions defines interaction patterns
  review:
    questions: []
  validation:
    rules:
    - id: ft-sec-interactions-001
      description: Component Interactions section exists
      condition: >-
        document has a section with semantic_type = 'component_interactions'
      message: Missing required 'Component Interactions' section
      severity: error
      weight: 1.5
      mandatory: true
      evidence:
        type: section_presence
        semantic_type: component_interactions
    - id: ft-sec-interactions-002
      description: Component Interactions describes interactions
      condition: >-
        section contains descriptions of how components communicate and interact with
        each other
      message: >-
        Component Interactions section does not describe interactions
      severity: error
      weight: 1.0
      mandatory: true
      evidence:
        type: content_check
        keywords:
        - communicate
        - interact
        - call
        - invoke
        - message
        - event
    - id: ft-sec-interactions-003
      description: Component Interactions is technology-independent
      condition: >-
        section does not name specific communication protocols, message formats, or
        implementation technologies
      message: >-
        Component Interactions section contains implementation technology references
      severity: error
      weight: 1.0
      mandatory: true
      evidence:
        type: keyword_absence
        categories:
        - programming_languages
        - frameworks
        - libraries
        - protocols
    - id: ft-sec-interactions-004
      description: Component Interactions defines interaction patterns
      condition: >-
        section specifies the patterns of interaction (sync, async, event-driven)
      message: >-
        Component Interactions section does not define interaction patterns
      severity: warning
      weight: 0.5
      mandatory: false
      evidence:
        type: content_check
        keywords:
        - synchronous
        - asynchronous
        - event
        - request
        - response
        - stream
