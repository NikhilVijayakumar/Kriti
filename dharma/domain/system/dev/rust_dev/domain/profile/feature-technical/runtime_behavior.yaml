schema:
  id: >-
    rust_dev.dharma.domain.feature-technical.profile.runtime_behavior
  name: Runtime Behavior Section Profile
  version: 0.1.0
source: >-
  common/tier3/audit/deterministic/section/feature-technical/07-runtime_behavior.yaml
section:
  id: runtime_behavior
  writing_objective: >-
    Write the Runtime Behavior section, in the imperative voice, in mixed form, with
    a technical tone, for the engineer. Do: Describe the full lifecycle — initialization,
    execution flow, state transitions, and shutdown — at the architectural level;
    define each state and valid transitions; include a flowchart. Don't: Name specific
    runtime frameworks, connection strings, or configuration files; describe threading
    or process models; use implementation-level lifecycle hooks.
  knowledge_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  reader_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  required_inputs:
  - Component Interactions
  - Architecture(05) runtime boundaries
  expected_outputs:
    primary:
    - flowchart showing runtime lifecycle and state transitions
  subsections: {}
  completion:
    checklist:
    - Runtime Behavior section exists
    - Runtime Behavior describes runtime behavior
    - Runtime Behavior is technology-independent
  review:
    questions: []
  validation:
    rules:
    - id: ft-sec-runtime-001
      description: Runtime Behavior section exists
      condition: >-
        document has a section with semantic_type = 'runtime_behavior'
      message: Missing optional 'Runtime Behavior' section
      severity: info
      weight: 0.3
      mandatory: false
      evidence:
        type: section_presence
        semantic_type: runtime_behavior
    - id: ft-sec-runtime-002
      description: Runtime Behavior describes runtime behavior
      condition: >-
        section contains descriptions of how the feature behaves at runtime
      message: Runtime Behavior section does not describe runtime behavior
      severity: warning
      weight: 0.5
      mandatory: false
      evidence:
        type: content_check
        keywords:
        - runtime
        - execute
        - operate
        - process
        - perform
    - id: ft-sec-runtime-003
      description: Runtime Behavior is technology-independent
      condition: >-
        section does not reference specific runtime environments, VMs, or implementation
        technologies
      message: >-
        Runtime Behavior section contains implementation technology references
      severity: error
      weight: 1.0
      mandatory: false
      evidence:
        type: keyword_absence
        categories:
        - programming_languages
        - frameworks
        - libraries
