section:
  id: communication_paths
  writing_objective: >-
    Write the Communication Paths section, in the imperative voice, in bullet lists
    form, with a technical tone, for the architect. Do: Define direction, nature,
    and architectural protocol for every communication path; trace each path to a
    Component Interaction; reference the Architecture communication model. Don't:
    Specify HTTP methods, URLs, or payload schemas; describe serialization or wire
    formats; use library-specific communication patterns.
  knowledge_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  reader_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  required_inputs:
  - Component Interactions
  - Architecture(05) communication model
  expected_outputs:
    primary:
    - sequence diagram showing communication paths
  subsections: {}
  completion:
    checklist:
    - Communication Paths section exists
    - Communication Paths defines paths
    - Communication Paths is technology-independent
  review:
    questions: []
  validation:
    rules:
    - id: ft-sec-comm-001
      description: Communication Paths section exists
      condition: >-
        document has a section with semantic_type = 'communication_paths'
      message: Missing optional 'Communication Paths' section
      severity: info
      weight: 0.3
      mandatory: false
      evidence:
        type: section_presence
        semantic_type: communication_paths
    - id: ft-sec-comm-002
      description: Communication Paths defines paths
      condition: >-
        section contains descriptions of communication paths between components
      message: >-
        Communication Paths section does not define communication paths
      severity: warning
      weight: 0.5
      mandatory: false
      evidence:
        type: content_check
        keywords:
        - path
        - channel
        - route
        - transport
        - message
        - event
    - id: ft-sec-comm-003
      description: Communication Paths is technology-independent
      condition: >-
        section does not reference specific protocols, message brokers, or implementation
        technologies
      message: >-
        Communication Paths section contains implementation technology references
      severity: error
      weight: 1.0
      mandatory: false
      evidence:
        type: keyword_absence
        categories:
        - programming_languages
        - frameworks
        - libraries
        - protocols
