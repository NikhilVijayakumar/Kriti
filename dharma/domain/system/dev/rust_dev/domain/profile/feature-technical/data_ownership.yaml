schema:
  id: >-
    rust_dev.dharma.domain.feature-technical.profile.data_ownership
  name: Data Ownership Section Profile
  version: 0.1.0
source: >-
  common/tier3/audit/deterministic/section/feature-technical/04-data_ownership.yaml
section:
  id: data_ownership
  writing_objective: >-
    Write the Data Ownership section, in the imperative voice, in tables form, with
    a technical tone, for the architect. Do: Assign one owning component per data
    element; define read and write access boundaries explicitly; reference Architecture
    ownership rules; include an ER diagram. Don't: Describe database schemas, column
    types, or ORM mappings; allow multiple owners for the same data element; use implementation-specific
    storage details.
  knowledge_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  reader_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  required_inputs:
  - Architecture(05) ownership rules
  - Participating Components
  expected_outputs:
    primary:
    - ER diagram showing data ownership boundaries
  subsections: {}
  completion:
    checklist:
    - Data Ownership section exists
    - Data Ownership defines data ownership
    - Data Ownership is technology-independent
    - Data Ownership defines data lifecycle
  review:
    questions: []
  validation:
    rules:
    - id: ft-sec-data-001
      description: Data Ownership section exists
      condition: document has a section with semantic_type = 'data_ownership'
      message: Missing required 'Data Ownership' section
      severity: error
      weight: 1.5
      mandatory: true
      evidence:
        type: section_presence
        semantic_type: data_ownership
    - id: ft-sec-data-002
      description: Data Ownership defines data ownership
      condition: >-
        section contains descriptions of which components own or are responsible for
        which data
      message: Data Ownership section does not define data ownership
      severity: error
      weight: 1.0
      mandatory: true
      evidence:
        type: content_check
        keywords:
        - owns
        - responsible
        - data
        - store
        - persist
        - read
        - write
    - id: ft-sec-data-003
      description: Data Ownership is technology-independent
      condition: >-
        section does not name specific databases, storage technologies, or implementation
        details
      message: >-
        Data Ownership section contains implementation technology references
      severity: error
      weight: 1.0
      mandatory: true
      evidence:
        type: keyword_absence
        categories:
        - programming_languages
        - frameworks
        - libraries
        - database_schemas
    - id: ft-sec-data-004
      description: Data Ownership defines data lifecycle
      condition: >-
        section specifies how data is created, read, updated, and deleted across components
      message: Data Ownership section does not define data lifecycle
      severity: warning
      weight: 0.5
      mandatory: false
      evidence:
        type: content_check
        keywords:
        - create
        - read
        - update
        - delete
        - lifecycle
        - retention
