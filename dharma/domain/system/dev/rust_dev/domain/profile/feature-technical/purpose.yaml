schema:
  id: rust_dev.dharma.domain.feature-technical.profile.purpose
  name: Purpose Section Profile
  version: 0.1.0
source: >-
  common/tier3/audit/deterministic/section/feature-technical/01-purpose.yaml
section:
  id: purpose
  writing_objective: >-
    Write the Purpose section, in the third person voice, in paragraphs form, with
    a technical tone, for the architect. Do: Define Feature Technical Design in relation
    to the documentation ecosystem; explicitly state what it is not; maintain the
    one-to-one mapping constraint throughout. Don't: Drift into implementation specifics;
    conflate with Architecture or Feature Design; list features or technologies.
  knowledge_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  reader_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  required_inputs:
  - Feature(04)
  - Architecture(05)
  expected_outputs:
    primary: []
  subsections: {}
  completion:
    checklist:
    - Purpose section exists
    - Purpose states feature technical intent
    - Purpose is technology-independent
    - Purpose scope boundaries defined
  review:
    questions: []
  validation:
    rules:
    - id: ft-sec-purpose-001
      description: Purpose section exists
      condition: document has a section with semantic_type = 'purpose'
      message: Missing required 'Purpose' section
      severity: error
      weight: 1.5
      mandatory: true
      evidence:
        type: section_presence
        semantic_type: purpose
    - id: ft-sec-purpose-002
      description: Purpose states feature technical intent
      condition: >-
        section contains a statement of why Feature Technical Documentation exists
      message: Purpose section does not state feature technical intent
      severity: error
      weight: 1.0
      mandatory: true
      evidence:
        type: content_check
        keywords:
        - feature
        - technical
        - standard
        - documentation
        - purpose
    - id: ft-sec-purpose-003
      description: Purpose is technology-independent
      condition: >-
        section does not reference specific technologies, frameworks, or implementation
        details
      message: >-
        Purpose section contains implementation technology references
      severity: error
      weight: 1.0
      mandatory: true
      evidence:
        type: keyword_absence
        categories:
        - programming_languages
        - frameworks
        - libraries
    - id: ft-sec-purpose-004
      description: Purpose scope boundaries defined
      condition: >-
        section defines what Feature Technical Documentation is and is not
      message: Purpose section does not define scope boundaries
      severity: warning
      weight: 0.5
      mandatory: false
      evidence:
        type: content_check
        patterns:
        - unlike
        - not
        - does not
