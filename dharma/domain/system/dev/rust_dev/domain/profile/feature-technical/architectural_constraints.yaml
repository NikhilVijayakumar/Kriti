schema:
  id: >-
    rust_dev.dharma.domain.feature-technical.profile.architectural_constraints
  name: Architectural Constraints Section Profile
  version: 0.1.0
source: >-
  common/tier3/audit/deterministic/section/feature-technical/12-architectural_constraints.yaml
section:
  id: architectural_constraints
  writing_objective: >-
    Write the Architectural Constraints section, in the imperative voice, in bullet
    lists form, with a technical tone, for the architect. Do: Reference each architectural
    constraint by its Architecture source principle; state how the constraint applies
    to this feature; avoid redefining architectural principles. Don't: Redefine or
    paraphrase Architecture principles; introduce implementation-level constraints;
    name technologies or frameworks as constraints.
  knowledge_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  reader_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  required_inputs:
  - Architecture(05) principles
  - constraints
  expected_outputs:
    primary: []
  subsections: {}
  completion:
    checklist:
    - Architectural Constraints section exists
    - Architectural Constraints defines constraints
    - Architectural Constraints references Architecture domain
  review:
    questions: []
  validation:
    rules:
    - id: ft-sec-archcon-001
      description: Architectural Constraints section exists
      condition: >-
        document has a section with semantic_type = 'architectural_constraints'
      message: Missing optional 'Architectural Constraints' section
      severity: info
      weight: 0.3
      mandatory: false
      evidence:
        type: section_presence
        semantic_type: architectural_constraints
    - id: ft-sec-archcon-002
      description: Architectural Constraints defines constraints
      condition: >-
        section contains architectural constraints that limit how the feature can
        be implemented
      message: >-
        Architectural Constraints section does not define constraints
      severity: warning
      weight: 0.5
      mandatory: false
      evidence:
        type: content_check
        keywords:
        - architectural
        - constraint
        - must
        - shall
        - cannot
        - limitation
    - id: ft-sec-archcon-003
      description: Architectural Constraints references Architecture domain
      condition: >-
        section references Architecture documentation as source of constraints
      message: >-
        Architectural Constraints section does not reference Architecture domain
      severity: warning
      weight: 0.5
      mandatory: false
      evidence:
        type: content_check
        keywords:
        - architecture
        - component model
        - data flow
        - communication
