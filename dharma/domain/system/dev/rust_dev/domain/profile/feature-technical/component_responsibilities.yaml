schema:
  id: >-
    rust_dev.dharma.domain.feature-technical.profile.component_responsibilities
  name: Component Responsibilities Section Profile
  version: 0.1.0
source: >-
  common/tier3/audit/deterministic/section/feature-technical/06-component_responsibilities.yaml
section:
  id: component_responsibilities
  writing_objective: >-
    Write the Component Responsibilities section, in the imperative voice, in bullet
    lists form, with a technical tone, for the architect. Do: Assign a primary responsibility
    to every participating component; ensure responsibilities do not overlap; align
    each responsibility with Architecture ownership rules; include a component diagram.
    Don't: Describe class hierarchies, method signatures, or library usage; assign
    shared ownership; leave any participating component without a defined responsibility.
  knowledge_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  reader_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  required_inputs:
  - Participating Components
  - Architecture(05) component model
  expected_outputs:
    primary:
    - component diagram showing responsibility assignments
  subsections: {}
  completion:
    checklist:
    - Component Responsibilities section exists
    - Component Responsibilities defines responsibilities
    - Component Responsibilities aligns with Architecture
  review:
    questions: []
  validation:
    rules:
    - id: ft-sec-resp-001
      description: Component Responsibilities section exists
      condition: >-
        document has a section with semantic_type = 'component_responsibilities'
      message: Missing optional 'Component Responsibilities' section
      severity: info
      weight: 0.3
      mandatory: false
      evidence:
        type: section_presence
        semantic_type: component_responsibilities
    - id: ft-sec-resp-002
      description: Component Responsibilities defines responsibilities
      condition: >-
        section contains detailed responsibilities for each participating component
      message: >-
        Component Responsibilities section does not define component responsibilities
      severity: warning
      weight: 0.5
      mandatory: false
      evidence:
        type: content_check
        keywords:
        - responsible
        - responsibility
        - handles
        - manages
        - owns
    - id: ft-sec-resp-003
      description: Component Responsibilities aligns with Architecture
      condition: section does not contradict the Architecture component model
      message: >-
        Component Responsibilities section contradicts Architecture component model
      severity: error
      weight: 1.0
      mandatory: false
      evidence:
        type: cross_reference
        expected:
        - domain: architecture
          direction: derives_from
