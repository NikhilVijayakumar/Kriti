schema:
  id: >-
    rust_dev.dharma.domain.feature-technical.profile.integration_points
  name: Integration Points Section Profile
  version: 0.1.0
source: >-
  common/tier3/audit/deterministic/section/feature-technical/09-integration_points.yaml
section:
  id: integration_points
  writing_objective: >-
    Write the Integration Points section, in the imperative voice, in bullet lists
    form, with a technical tone, for the architect. Do: Identify every integration
    point with systems involved, nature of integration, and boundary type; classify
    each as internal, external, or third-party; include a component diagram. Don't:
    Describe API endpoints, authentication token formats, or request/response schemas;
    specify retry logic or error handling at the integration; name client libraries.
  knowledge_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  reader_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  required_inputs:
  - Feature Specification
  - Architecture(05) boundaries
  expected_outputs:
    primary:
    - component diagram showing integration boundaries
  subsections: {}
  completion:
    checklist:
    - Integration Points section exists
    - Integration Points defines integration points
    - Integration Points is technology-independent
  review:
    questions: []
  validation:
    rules:
    - id: ft-sec-integration-001
      description: Integration Points section exists
      condition: >-
        document has a section with semantic_type = 'integration_points'
      message: Missing optional 'Integration Points' section
      severity: info
      weight: 0.3
      mandatory: false
      evidence:
        type: section_presence
        semantic_type: integration_points
    - id: ft-sec-integration-002
      description: Integration Points defines integration points
      condition: >-
        section contains descriptions of where the feature integrates with external
        systems or other features
      message: >-
        Integration Points section does not define integration points
      severity: warning
      weight: 0.5
      mandatory: false
      evidence:
        type: content_check
        keywords:
        - integrate
        - integration
        - external
        - interface
        - adapter
        - bridge
    - id: ft-sec-integration-003
      description: Integration Points is technology-independent
      condition: >-
        section does not reference specific external systems, APIs, or implementation
        technologies
      message: >-
        Integration Points section contains implementation technology references
      severity: error
      weight: 1.0
      mandatory: false
      evidence:
        type: keyword_absence
        categories:
        - programming_languages
        - frameworks
        - libraries
        - api_references
