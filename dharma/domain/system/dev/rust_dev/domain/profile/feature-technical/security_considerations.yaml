schema:
  id: >-
    rust_dev.dharma.domain.feature-technical.profile.security_considerations
  name: Security Considerations Section Profile
  version: 0.1.0
source: >-
  common/tier3/audit/deterministic/section/feature-technical/13-security_considerations.yaml
section:
  id: security_considerations
  writing_objective: >-
    Write the Security Considerations section, in the imperative voice, in bullet
    lists form, with a technical tone, for the architect. Do: Define security boundaries,
    authentication requirements, and authorization rules at the architectural level;
    identify sensitive data; reference Architecture security boundaries and External
    Context security constraints. Don't: Name specific encryption algorithms, libraries,
    or token formats; describe code-level security patterns; specify cookie or header
    configurations.
  knowledge_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  reader_goal: >-
    Authored placeholder - no source exists in the rust_dev standard for this field;
    generated by generate_domain_map_profile.py until a human author writes it.
  required_inputs:
  - Architecture(05) security boundaries
  - External Context(08)
  - Security Documentation(03)
  expected_outputs:
    primary: []
  subsections: {}
  completion:
    checklist:
    - Security Considerations section exists
    - Security Considerations defines security aspects
    - Security Considerations is technology-independent
  review:
    questions: []
  validation:
    rules:
    - id: ft-sec-security-001
      description: Security Considerations section exists
      condition: >-
        document has a section with semantic_type = 'security_considerations'
      message: Missing optional 'Security Considerations' section
      severity: info
      weight: 0.3
      mandatory: false
      evidence:
        type: section_presence
        semantic_type: security_considerations
    - id: ft-sec-security-002
      description: Security Considerations defines security aspects
      condition: >-
        section contains security considerations such as authentication, authorization,
        encryption, or data protection
      message: >-
        Security Considerations section does not define security aspects
      severity: warning
      weight: 0.5
      mandatory: false
      evidence:
        type: content_check
        keywords:
        - authenticat
        - authoriz
        - encrypt
        - secure
        - protect
        - permission
        - access control
    - id: ft-sec-security-003
      description: Security Considerations is technology-independent
      condition: >-
        section does not reference specific security libraries, frameworks, or implementation
        technologies
      message: >-
        Security Considerations section contains implementation technology references
      severity: error
      weight: 1.0
      mandatory: false
      evidence:
        type: keyword_absence
        categories:
        - programming_languages
        - frameworks
        - libraries
