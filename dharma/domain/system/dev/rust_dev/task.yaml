x_task_templates:
  pg_input: &pg_input
    type: object
    properties:
      repo_path:
        type: string
        description: Filesystem path of the repository being documented.
      domain:
        type: string
        description: The documentation domain to generate (the task name pins it).
      upstream_documents:
        type: object
        additionalProperties:
          type: string
        description: Upstream document name -> file path per the domain's derivation chain;
          empty for the root (vision) domain.
    required:
    - repo_path
    - domain
    - upstream_documents
  pg_output: &pg_output
    type: object
    properties:
      document:
        type: string
        description: Full generated document text.
      sections:
        type: object
        additionalProperties:
          type: string
        description: Section id -> rendered content for every required section of the
          domain's section map.
      conformant_to:
        type: string
        description: Section-map reference the document was generated against.
      mandatory_rule_results:
        type: array
        description: Pass/fail for every validation rule marked mandatory in the domain's
          profile.
        items:
          type: object
          properties:
            rule_id:
              type: string
            pass:
              type: boolean
          required:
          - rule_id
          - pass
    required:
    - document
    - sections
    - conformant_to
    - mandatory_rule_results
  pg_acceptance: &pg_acceptance
    happy_path:
    - every required section from the domain's section map is present in the output document
    - 'every validation rule marked mandatory: true passes against the output document'
    corner_case:
    - 'a validation rule marked mandatory: false fails (e.g. severity warning) yet the
      document still generates successfully'
    edge_case:
    - an upstream document the domain derives from is missing or non-conformant; the task
      fails closed instead of generating against an invalid upstream
  rc_input: &rc_input
    type: object
    properties:
      repo_path:
        type: string
        description: Filesystem path of the existing repository.
      domain:
        type: string
      current_document:
        type: string
        description: Existing document text, or null when the repository has none.
    required:
    - repo_path
    - domain
    - current_document
  rc_output: &rc_output
    type: object
    properties:
      document:
        type: string
        description: Full generated document text.
      sections:
        type: object
        additionalProperties:
          type: string
        description: Section id -> rendered content for every required section of the
          domain's section map.
      conformant_to:
        type: string
        description: Section-map reference the document was generated against.
      mandatory_rule_results:
        type: array
        description: Pass/fail for every validation rule marked mandatory in the domain's
          profile.
        items:
          type: object
          properties:
            rule_id:
              type: string
            pass:
              type: boolean
          required:
          - rule_id
          - pass
    required:
    - document
    - sections
    - conformant_to
    - mandatory_rule_results
  rc_acceptance: &rc_acceptance
    happy_path:
    - the document already exists and every mandatory validation rule passes; reconcile
      is a verified no-op
    corner_case:
    - the document exists but one or more mandatory rules fail; the task reports the failing
      rules and routes to the fix archetype instead of rewriting
    edge_case:
    - the document does not exist at all; the task generates it from scratch, same as
      the greenfield archetype
  gd_input: &gd_input
    type: object
    properties:
      domain:
        type: string
      upstream_documents:
        type: object
        additionalProperties:
          type: string
        description: Upstream document name -> file path required to generate this domain's
          document.
    required:
    - domain
    - upstream_documents
  gd_output: &gd_output
    type: object
    properties:
      document:
        type: string
        description: Full generated document text.
      sections:
        type: object
        additionalProperties:
          type: string
        description: Section id -> rendered content for every required section of the
          domain's section map.
      conformant_to:
        type: string
        description: Section-map reference the document was generated against.
      mandatory_rule_results:
        type: array
        description: Pass/fail for every validation rule marked mandatory in the domain's
          profile.
        items:
          type: object
          properties:
            rule_id:
              type: string
            pass:
              type: boolean
          required:
          - rule_id
          - pass
    required:
    - document
    - sections
    - conformant_to
    - mandatory_rule_results
  gd_acceptance: &gd_acceptance
    happy_path:
    - the document is generated with every required section present and every mandatory
      validation rule passing
    corner_case:
    - an upstream document is present but incomplete for one section; that section is
      generated best-effort and flagged, never fabricated
    edge_case:
    - an upstream document is missing or non-conformant; the task fails closed
  da_input: &da_input
    type: object
    properties:
      document:
        type: string
        description: The domain document to audit.
      section_map:
        type: object
        description: The domain's section map the document must conform to.
    required:
    - document
    - section_map
  da_output: &da_output
    type: object
    properties:
      verdict:
        type: string
        enum:
        - compliant
        - compliant-with-warnings
        - non-compliant
      findings:
        type: array
        items:
          type: object
          properties:
            rule_id:
              type: string
            condition:
              type: string
            message:
              type: string
            severity:
              type: string
            weight:
              type: number
            mandatory:
              type: boolean
            evidence:
              type: string
            pass:
              type: boolean
          required:
          - rule_id
          - condition
          - severity
          - weight
          - mandatory
          - pass
    required:
    - verdict
    - findings
  da_acceptance: &da_acceptance
    happy_path:
    - all mandatory rules pass; verdict is compliant
    corner_case:
    - a non-mandatory rule fails; verdict is compliant-with-warnings with the warning-level
      finding recorded
    edge_case:
    - the document is missing or a mandatory rule fails; verdict is non-compliant and
      the failing rules are returned for the fix archetype
  sa_input: &sa_input
    type: object
    properties:
      document:
        type: string
      writing_objective:
        type: string
      knowledge_goal:
        type: string
      reader_goal:
        type: string
      completion_checklist:
        type: array
        items:
          type: string
      review_questions:
        type: array
        items:
          type: string
    required:
    - document
    - writing_objective
    - knowledge_goal
    - reader_goal
  sa_output: &sa_output
    type: object
    properties:
      score:
        type: number
        minimum: 0
        maximum: 100
      findings:
        type: array
        items:
          type: object
          properties:
            finding_id:
              type: string
            message:
              type: string
            severity:
              type: string
            weight:
              type: number
            evidence:
              type: string
          required:
          - finding_id
          - message
          - severity
          - weight
      bounded_by:
        type: string
        description: When objectives are authored placeholders, the audit is bounded by
          them.
    required:
    - score
    - findings
    - bounded_by
  sa_acceptance: &sa_acceptance
    happy_path:
    - the document satisfies the profile's writing objective, knowledge goal, and reader
      goal; scored with supporting findings
    corner_case:
    - a review question is only partially satisfied; flagged as a warning-level finding
      without failing the audit
    edge_case:
    - the document is missing; a non-scorable finding is returned and the placeholder
      objective dependency is noted when objectives are authored placeholders
  fx_input: &fx_input
    type: object
    properties:
      document:
        type: string
      failing_findings:
        type: array
        description: The failing rules from the deterministic/semantic audits that must
          be resolved.
        items:
          type: object
      max_attempts:
        type: integer
        minimum: 1
        description: Bounded fix attempts before escalation.
    required:
    - document
    - failing_findings
    - max_attempts
  fx_output: &fx_output
    type: object
    properties:
      document:
        type: string
        description: Corrected document.
      fixed_rule_ids:
        type: array
        items:
          type: string
      remaining_findings:
        type: array
        items:
          type: object
      escalated:
        type: boolean
        description: True when the fix could not resolve within max_attempts.
    required:
    - document
    - fixed_rule_ids
    - remaining_findings
    - escalated
  fx_acceptance: &fx_acceptance
    happy_path:
    - every previously-failing mandatory rule now passes; corrected document returned
      with the fixed rule ids
    corner_case:
    - the fix resolves the mandatory failures but introduces a new non-mandatory rule
      failure; flagged, not silently accepted
    edge_case:
    - the fix cannot resolve the failures within the bounded attempt count; escalates
      to a human reviewer instead of looping forever
  br_input: &br_input
    type: object
    properties:
      repo_path:
        type: string
      source_code_scan:
        type: object
        additionalProperties: true
        description: Scan of the repository structure (crates, entry points, public API)
          used to bootstrap the README.
    required:
    - repo_path
    - source_code_scan
  br_output: &br_output
    type: object
    properties:
      document:
        type: string
      scaffolded_sections:
        type: array
        items:
          type: string
        description: Sections rendered as TBD notes because no source structure was discoverable
          for them.
      escalated:
        type: boolean
    required:
    - document
    - scaffolded_sections
    - escalated
  br_acceptance: &br_acceptance
    happy_path:
    - the README meets every required section of the readme section map
    corner_case:
    - only partial repository structure is discoverable; affected sections are scaffolded
      as explicit TBD notes, not fabricated content
    edge_case:
    - no repository structure is discoverable at all; the task escalates to a human instead
      of inventing content
  calc_input: &calc_input
    type: object
    properties:
      domain_scores:
        type: object
        additionalProperties:
          type: object
          properties:
            deterministic_whole:
              type: number
              minimum: 0
              maximum: 100
            deterministic_section:
              type: number
              minimum: 0
              maximum: 100
            semantic_whole:
              type: number
              minimum: 0
              maximum: 100
            semantic_section:
              type: number
              minimum: 0
              maximum: 100
          required:
          - deterministic_whole
          - deterministic_section
          - semantic_whole
          - semantic_section
      weights:
        type: object
        properties:
          deterministic:
            type: number
          semantic:
            type: number
        required:
        - deterministic
        - semantic
    required:
    - domain_scores
    - weights
  calc_output: &calc_output
    type: object
    properties:
      final_score:
        type: number
        description: Weighted-sum aggregate across available domains.
      per_domain:
        type: array
        items:
          type: object
      missing_domains:
        type: array
        items:
          type: string
        description: Domains excluded from the aggregate, listed explicitly.
      formula:
        type: string
        description: The rust_dev 25/25/25/25 weighted_sum.
    required:
    - final_score
    - per_domain
    - missing_domains
    - formula
  calc_acceptance: &calc_acceptance
    happy_path:
    - all 13 domains have deterministic and semantic scores; final_score is computed via
      the weighted_sum formula
    corner_case:
    - one or more domain scores are missing; the aggregate is computed over the available
      domains and the missing ones are listed as explicit gaps, never silently omitted
    edge_case:
    - a score is outside the 0-100 range; rejected as invalid input and no score is computed
  rr_input: &rr_input
    type: object
    properties:
      final_scores:
        type: object
      score_history:
        type: array
        items:
          type: object
    required:
    - final_scores
    - score_history
  rr_output: &rr_output
    type: object
    properties:
      report:
        type: string
        description: Consolidated markdown audit report.
      gap_notes:
        type: array
        items:
          type: string
    required:
    - report
    - gap_notes
  rr_acceptance: &rr_acceptance
    happy_path:
    - the consolidated audit report renders from the calculated per-domain scores
    corner_case:
    - some data is missing (a domain score or a history entry); an explicit gap note is
      rendered in its place, never a silent omission
    edge_case:
    - no score data at all; the report renders a header plus an explicit empty-state gap
      note
  chart_input: &chart_input
    type: object
    properties:
      final_scores:
        type: object
      score_history:
        type: array
        items:
          type: object
    required:
    - final_scores
    - score_history
  chart_output: &chart_output
    type: object
    properties:
      charts:
        type: array
        items:
          type: object
          properties:
            chart_id:
              type: string
            format:
              type: string
            data:
              type: string
          required:
          - chart_id
          - format
          - data
      gap_notes:
        type: array
        items:
          type: string
    required:
    - charts
    - gap_notes
  chart_acceptance: &chart_acceptance
    happy_path:
    - score-history and per-domain comparison charts render from the recorded findings
    corner_case:
    - a domain has no history entries; it is excluded from the trend chart with an explicit
      note
    edge_case:
    - no chartable data at all; an explicit empty-state placeholder is rendered instead
      of a blank image
epics:
- name: repo-new
  objective: >-
    Stand up the full rust_dev documentation set for a repository at the moment it registers
    against the rust-dev-domain Domain System, proposing and then executing the generation of
    each domain document in standard order.
  sort_order: 1
  usecases:
  - name: propose-and-generate-vision
    description: >-
      Propose and, on approval, execute the generation of the Vision document for a repository
      at the moment it registers against the rust-dev-domain Domain System, per the rust_dev
      Vision standard.
    sort_order: 1
    tasks:
    - name: propose-and-generate-vision
      description: >-
        Propose the Vision document for a newly-registering repository and, on approval, generate it from the vision section map and its upstream documents, then verify every required section and mandatory rule.
      input_contract: *pg_input
      output_contract: *pg_output
      acceptance_criteria: *pg_acceptance
  - name: propose-and-generate-philosophy
    description: >-
      Propose and, on approval, execute the generation of the Philosophy document for a repository
      at the moment it registers against the rust-dev-domain Domain System, per the rust_dev
      Philosophy standard.
    sort_order: 2
    tasks:
    - name: propose-and-generate-philosophy
      description: >-
        Propose the Philosophy document for a newly-registering repository and, on approval, generate it from the philosophy section map and its upstream documents, then verify every required section and mandatory rule.
      input_contract: *pg_input
      output_contract: *pg_output
      acceptance_criteria: *pg_acceptance
  - name: propose-and-generate-security
    description: >-
      Propose and, on approval, execute the generation of the Security document for a repository
      at the moment it registers against the rust-dev-domain Domain System, per the rust_dev
      Security standard.
    sort_order: 3
    tasks:
    - name: propose-and-generate-security
      description: >-
        Propose the Security document for a newly-registering repository and, on approval, generate it from the security section map and its upstream documents, then verify every required section and mandatory rule.
      input_contract: *pg_input
      output_contract: *pg_output
      acceptance_criteria: *pg_acceptance
  - name: propose-and-generate-feature
    description: >-
      Propose and, on approval, execute the generation of the Feature document for a repository
      at the moment it registers against the rust-dev-domain Domain System, per the rust_dev
      Feature standard.
    sort_order: 4
    tasks:
    - name: propose-and-generate-feature
      description: >-
        Propose the Feature document for a newly-registering repository and, on approval, generate it from the feature section map and its upstream documents, then verify every required section and mandatory rule.
      input_contract: *pg_input
      output_contract: *pg_output
      acceptance_criteria: *pg_acceptance
  - name: propose-and-generate-architecture
    description: >-
      Propose and, on approval, execute the generation of the Architecture document for a repository
