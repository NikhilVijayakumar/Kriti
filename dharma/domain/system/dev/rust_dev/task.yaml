- name: repo-existing
  objective: >-
    Bring the documentation of an already-existing repository into conformance with the rust_dev
    standard, generating any missing domain documents and bootstrapping the README when no documentation
    exists at all.
  sort_order: 2
  usecases:
  - name: reconcile-vision
    description: >-
      Reconcile the existing repository's Vision document with the rust_dev Vision standard:
      generate it if absent, otherwise leave it in place for the document-maintenance flow to
      act on (bootstrap-readme runs first when the repository has no documentation at all).
    sort_order: 1
    tasks:
    - name: reconcile-vision
      description: >-
        Reconcile an existing repository's Vision document with the rust_dev vision standard: leave it in place when already conformant, report and route to the fix archetype when it fails mandatory rules, and generate it from scratch when absent.
      input_contract: *rc_input
      output_contract: *rc_output
      acceptance_criteria: *rc_acceptance
  - name: reconcile-philosophy
    description: >-
      Reconcile the existing repository's Philosophy document with the rust_dev Philosophy standard:
      generate it if absent, otherwise leave it in place for the document-maintenance flow to
      act on (bootstrap-readme runs first when the repository has no documentation at all).
    sort_order: 2
    tasks:
    - name: reconcile-philosophy
      description: >-
        Reconcile an existing repository's Philosophy document with the rust_dev philosophy standard: leave it in place when already conformant, report and route to the fix archetype when it fails mandatory rules, and generate it from scratch when absent.
      input_contract: *rc_input
      output_contract: *rc_output
      acceptance_criteria: *rc_acceptance
  - name: reconcile-security
    description: >-
      Reconcile the existing repository's Security document with the rust_dev Security standard:
      generate it if absent, otherwise leave it in place for the document-maintenance flow to
      act on (bootstrap-readme runs first when the repository has no documentation at all).
    sort_order: 3
    tasks:
    - name: reconcile-security
      description: >-
        Reconcile an existing repository's Security document with the rust_dev security standard: leave it in place when already conformant, report and route to the fix archetype when it fails mandatory rules, and generate it from scratch when absent.
      input_contract: *rc_input
      output_contract: *rc_output
      acceptance_criteria: *rc_acceptance
  - name: reconcile-feature
    description: >-
      Reconcile the existing repository's Feature document with the rust_dev Feature standard:
      generate it if absent, otherwise leave it in place for the document-maintenance flow to
      act on (bootstrap-readme runs first when the repository has no documentation at all).
    sort_order: 4
    tasks:
    - name: reconcile-feature
      description: >-
        Reconcile an existing repository's Feature document with the rust_dev feature standard: leave it in place when already conformant, report and route to the fix archetype when it fails mandatory rules, and generate it from scratch when absent.
      input_contract: *rc_input
      output_contract: *rc_output
      acceptance_criteria: *rc_acceptance
  - name: reconcile-architecture
    description: >-
      Reconcile the existing repository's Architecture document with the rust_dev Architecture
      standard: generate it if absent, otherwise leave it in place for the document-maintenance
      flow to act on (bootstrap-readme runs first when the repository has no documentation at
      all).
    sort_order: 5
    tasks:
    - name: reconcile-architecture
      description: >-
        Reconcile an existing repository's Architecture document with the rust_dev architecture standard: leave it in place when already conformant, report and route to the fix archetype when it fails mandatory rules, and generate it from scratch when absent.
      input_contract: *rc_input
      output_contract: *rc_output
      acceptance_criteria: *rc_acceptance
  - name: reconcile-engineering
    description: >-
      Reconcile the existing repository's Engineering document with the rust_dev Engineering
      standard: generate it if absent, otherwise leave it in place for the document-maintenance
      flow to act on (bootstrap-readme runs first when the repository has no documentation at
      all).
    sort_order: 6
    tasks:
    - name: reconcile-engineering
      description: >-
        Reconcile an existing repository's Engineering document with the rust_dev engineering standard: leave it in place when already conformant, report and route to the fix archetype when it fails mandatory rules, and generate it from scratch when absent.
      input_contract: *rc_input
      output_contract: *rc_output
      acceptance_criteria: *rc_acceptance
  - name: reconcile-external-context
    description: >-
      Reconcile the existing repository's External Context document with the rust_dev External
      Context standard: generate it if absent, otherwise leave it in place for the document-maintenance
      flow to act on (bootstrap-readme runs first when the repository has no documentation at
      all).
    sort_order: 7
    tasks:
