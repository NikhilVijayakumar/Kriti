    - name: propose-and-generate-engineering
      description: >-
        Propose the Engineering document for a newly-registering repository and, on approval, generate it from the engineering section map and its upstream documents, then verify every required section and mandatory rule.
      input_contract: *pg_input
      output_contract: *pg_output
      acceptance_criteria: *pg_acceptance
  - name: propose-and-generate-external-context
