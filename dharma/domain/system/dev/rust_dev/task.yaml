- name: document-maintenance
  objective: >-
    Maintain any single domain document independent of repository state: generate, deterministically
    audit, semantically audit, and fix per-domain content under the rust_dev standard.
  sort_order: 3
  usecases:
  - name: generate-document-vision
    description: >-
      Generate the Vision document from the rust_dev Vision standard's template and writing
      guidance.
    sort_order: 1
    tasks:
    - name: generate-document-vision
      description: >-
        Generate the Vision document from the vision section map and the upstream documents its derivation chain requires, then verify the required sections and mandatory rules.
      input_contract: *gd_input
      output_contract: *gd_output
      acceptance_criteria: *gd_acceptance
  - name: deterministic-audit-vision
    description: >-
      Run the rust_dev Vision deterministic audit (section-level structural checks with per-rule
      severity, weight, and evidence) against the Vision document and record scored findings.
    sort_order: 2
    tasks:
    - name: deterministic-audit-vision
      description: >-
        Run the vision deterministic audit against the Vision document: section-level structural checks with per-rule severity, weight, and evidence, producing a compliant, compliant-with-warnings, or non-compliant verdict.
      input_contract: *da_input
      output_contract: *da_output
      acceptance_criteria: *da_acceptance
  - name: semantic-audit-vision
    description: >-
      Run the rust_dev Vision semantic audit against the Vision document and record the ensemble's
      scored findings.
    sort_order: 3
    tasks:
    - name: semantic-audit-vision
      description: >-
        Run the vision semantic audit against the Vision document against its writing objective, knowledge goal, and reader goal, producing a scored qualitative finding set.
      input_contract: *sa_input
      output_contract: *sa_output
      acceptance_criteria: *sa_acceptance
  - name: fix-vision
    description: >-
      Apply content-preserving fixes that bring the Vision document into conformance with the
      rust_dev Vision standard without redefining its intent.
    sort_order: 4
    tasks:
    - name: fix-vision
