- name: cross-domain
  objective: >-
    Provide the repository- and domain-agnostic capabilities the other Epics consume: cross-domain
    audit calculation, report rendering, and chart rendering.
  sort_order: 4
  usecases:
  - name: calculate
    description: >-
      Compute the aggregated rust_dev audit scores across all domains of a repository, applying
      the standard's deterministic/semantic weight and merge formulas.
    sort_order: 1
    tasks: []
  - name: render-report
    description: >-
      Render the consolidated rust_dev audit report for a repository from the calculated per-domain
      scores, per the standard's report templates.
    sort_order: 2
    tasks: []
  - name: render-charts
    description: >-
      Render the rust_dev audit visualizations (score history, per-domain comparisons) from
      the recorded findings for inclusion in the report.
    sort_order: 3
    tasks: []
