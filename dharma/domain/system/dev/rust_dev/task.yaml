- name: repo-existing
  objective: >-
    Bring the documentation of an already-existing repository into conformance with the rust_dev
    standard, generating any missing domain documents and bootstrapping the README when no documentation
    exists at all.
  sort_order: 2
  usecases:
  - name: reconcile-vision
    description: >-
      Reconcile the existing repository's Vision document with the rust_dev Vision standard:
      generate it if absent, otherwise leave it in place for the document-maintenance flow to
      act on (bootstrap-readme runs first when the repository has no documentation at all).
    sort_order: 1
    tasks: []
